server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed; the rest falls back to the SPA entry so deep links
    # such as /tools/motd work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ffmpeg.wasm / libarchive.js fetch .wasm modules from the same origin.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
}

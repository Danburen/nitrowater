plugins {
    id 'java'
    id 'application'
}

group = 'cn.nitrowater'
version = '1.0.0'
description = 'AutoGenTestCase (Java + JUnit): AST facts -> DeepSeek -> JUnit 5 tests -> run.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    // aliyun mirror first (fast in CN), then Maven Central.
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    mavenCentral()
}

dependencies {
    // Reuse the project's dependency versions via the Spring Boot BOM, exactly like the other
    // modules do through the Boot plugin: this pins Jackson 3 and the JUnit 5 line centrally.
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')

    // Jackson 3 (tools.jackson.*) - the same JSON stack used by nitrowater-lib's JsonUtil.
    implementation 'tools.jackson.core:jackson-databind'

    // --- "based on code AST" half of the design: parse Java source into an AST ---
    implementation 'com.github.javaparser:javaparser-core:3.26.4'

    // --- JUnit 5: the generated tests compile against these, and the CLI executes them
    //     at runtime through the Platform Launcher (ordinary runtime dependencies). ---
    implementation 'org.junit.jupiter:junit-jupiter'
    implementation 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']
}

application {
    mainClass = 'cn.nitrowater.autogen.AutoGenTestCaseCli'
    applicationDefaultJvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8'
    ]
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

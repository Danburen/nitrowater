<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NitroBot · 完整版界面体验</title>
  <style>
    :root {
      --bg: #f7f7f8; --bg-sidebar: #ffffff; --bg-card: #ffffff; --bg-user: #e8f0fe;
      --text-primary: #1a1a1e; --text-secondary: #6b6b76; --text-tertiary: #9a9aa5;
      --border: #e4e4e9; --border-light: #ececf1;
      --accent: #4f6ef7; --accent-hover: #3d5ae0; --accent-soft: #eef1fe;
      --warning: #d97706; --warning-soft: #fffbeb; --warning-border: #fde68a;
      --danger: #e5484d;
      --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-float: 0 8px 24px rgba(0,0,0,0.12);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg); height: 100vh; display: flex; color: var(--text-primary); overflow: hidden; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    textarea { font: inherit; resize: none; border: none; outline: none; background: transparent; color: inherit; }

    /* 主体布局 */
    .main { flex: 1; display: flex; flex-direction: column; position: relative; height: 100%; min-width: 0; }
    .chat-scroll { flex: 1; overflow-y: auto; padding: 24px 20px 140px; scroll-behavior: smooth; position: relative; }
    .chat-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

    /* 右侧对话列表 (Timeline) */
    .right-timeline {
      position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 20;
    }
    .timeline-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--border);
      cursor: pointer; transition: all 0.2s; position: relative;
    }
    .timeline-dot:hover, .timeline-dot.active { background: var(--accent); transform: scale(1.4); }
    .timeline-dot::before {
      content: attr(data-title); position: absolute; right: 20px; top: -6px;
      background: #333; color: #fff; padding: 4px 8px; border-radius: 4px;
      font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; transform: translateX(10px);
    }
    .timeline-dot:hover::before { opacity: 1; transform: translateX(0); }

    /* 消息气泡 */
    .message { display: flex; gap: 12px; }
    .message.user { flex-direction: row-reverse; }
    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: bold; color: white; flex-shrink: 0; }
    .message.ai .msg-avatar { background: linear-gradient(135deg, var(--accent), #8a5cf6); }
    .message.user .msg-avatar { background: linear-gradient(135deg, #f59e0b, #ef4444); }
    .msg-body { max-width: 80%; }
    .bubble { padding: 12px 16px; border-radius: var(--radius-lg); font-size: 14.5px; line-height: 1.6; }
    .message.ai .bubble { background: var(--bg-card); border: 1px solid var(--border-light); border-top-left-radius: 4px; box-shadow: var(--shadow-sm); }
    .message.user .bubble { background: var(--bg-user); border-top-right-radius: 4px; }

    /* 额度卡片 */
    .quota-alert { display: flex; gap: 12px; padding: 14px 16px; margin-top: 12px; border-radius: var(--radius-md); border: 1px solid; font-size: 13.5px; animation: fadeIn 0.3s; }
    .quota-alert.warning { background: var(--warning-soft); border-color: var(--warning-border); }
    .quota-alert.danger { background: var(--bg-card); border-color: var(--border); }
    .quota-icon { flex-shrink: 0; width: 20px; height: 20px; }
    .quota-alert.warning .quota-icon { color: var(--warning); }
    .quota-alert.danger .quota-icon { color: var(--text-tertiary); }
    .quota-content { flex: 1; }
    .quota-title { font-weight: 600; margin-bottom: 2px; }
    .quota-desc { color: var(--text-secondary); font-size: 13px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* 输入区 */
    .composer-wrap { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 20px 24px; background: linear-gradient(to top, var(--bg) 70%, transparent); pointer-events: none; z-index: 10; }
    .composer { max-width: 760px; margin: 0 auto; pointer-events: auto; }
    .composer-inner { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); transition: all 0.2s ease; }
    .composer-inner:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md); }
    .composer-top { padding: 12px 16px 6px; }
    .composer textarea { width: 100%; min-height: 24px; max-height: 180px; font-size: 15px; line-height: 1.5; scrollbar-width: none; -ms-overflow-style: none; }
    .composer textarea::-webkit-scrollbar { display: none; }
    .composer-toolbar { display: flex; align-items: center; gap: 8px; padding: 0 12px 10px; }

    /* ============================================================
       【方案1】精致胶囊徽章：联网按钮
       ============================================================ */
    .chip-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 100px;
      font-size: 12.5px; font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.2s;
      background: transparent;
    }
    /* 悬浮态 */
    .chip-btn:hover { background: rgba(0,0,0,0.04); color: var(--text-primary); }
    /* 开启态 */
    .chip-btn.active { background: var(--accent-soft); color: var(--accent); }
    .chip-btn svg { width: 15px; height: 15px; }

    .send-btn { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: #fff; transition: all 0.15s; }
    .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .send-btn:disabled { background: var(--border-light); color: var(--text-tertiary); cursor: not-allowed; }
    .send-btn svg { width: 18px; height: 18px; }

    /* ============================================================
       悬浮的“回到底部”按钮
       ============================================================ */
    .scroll-bottom-btn {
      position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px);
      width: 36px; height: 36px; border-radius: 50%; background: var(--bg-card);
      border: 1px solid var(--border); box-shadow: var(--shadow-md);
      display: grid; place-items: center; color: var(--text-secondary);
      opacity: 0; visibility: hidden; transition: all 0.25s ease; z-index: 20;
    }
    .scroll-bottom-btn.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .scroll-bottom-btn:hover { background: var(--bg-user); color: var(--accent); border-color: var(--accent); }
    .scroll-bottom-btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body>

<div class="main">
  <!-- 右侧对话列表 -->
  <div class="right-timeline" id="timeline">
    <!-- 动态生成 dot -->
  </div>

  <!-- 对话记录区 -->
  <div class="chat-scroll" id="chatScroll">
    <div class="chat-inner" id="chatInner">
      <!-- 消息内容 -->
    </div>
  </div>

  <!-- 返回底部按钮 -->
  <button class="scroll-bottom-btn" id="scrollBottomBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19" /><polyline points="19 12 12 19 5 12" />
    </svg>
  </button>

  <!-- 输入区 -->
  <div class="composer-wrap">
    <div class="composer">
      <div class="composer-inner">
        <div class="composer-top">
          <textarea id="input" rows="1" placeholder="给 NitroBot 发送消息…"></textarea>
        </div>

        <div class="composer-toolbar">
          <!-- 【方案1】精致胶囊按钮 -->
          <button class="chip-btn" id="webSearchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" />
            </svg>
            <span>联网</span>
          </button>

          <button class="send-btn" id="sendBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5" />
              <polyline points="5 12 12 5 19 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const chatInner = document.getElementById('chatInner');
  const chatScroll = document.getElementById('chatScroll');
  const webSearchBtn = document.getElementById('webSearchBtn');
  const scrollBottomBtn = document.getElementById('scrollBottomBtn');
  const timeline = document.getElementById('timeline');

  let isWebSearchOn = false;
  let quotaLeft = 30;
  let msgIdCounter = 0;

  // 1. 联网按钮（方案1 样式切换）
  webSearchBtn.addEventListener('click', () => {
    isWebSearchOn = !isWebSearchOn;
    webSearchBtn.classList.toggle('active', isWebSearchOn);
  });

  // 2. 输入框自适应
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    sendBtn.disabled = input.value.trim().length === 0;
  });

  // 3. 发送逻辑
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    // 渲染用户消息
    const userMsgId = `msg-${++msgIdCounter}`;
    chatInner.innerHTML += `
      <div class="message user" id="${userMsgId}">
        <div class="msg-avatar">U</div>
        <div class="msg-body"><div class="bubble">${text}</div></div>
      </div>`;

    // 添加右侧时间轴节点
    addTimelineDot(userMsgId, text);

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    scrollToBottom();

    // 模拟回复
    setTimeout(() => {
      const oldQuota = quotaLeft;
      quotaLeft -= 20;
      if (quotaLeft < 0) quotaLeft = 0;

      let alertHtml = '';
      if (quotaLeft === 0) {
        input.disabled = true;
        input.placeholder = "今日额度已用完";
        alertHtml = `
          <div class="quota-alert danger">
            <svg class="quota-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div class="quota-content"><div class="quota-title">今日额度已用完</div><div class="quota-desc">为保证体验，每日额度有限。</div></div>
          </div>`;
      } else if (quotaLeft <= 20 && oldQuota > 20) {
        alertHtml = `
          <div class="quota-alert warning">
            <svg class="quota-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <div class="quota-content"><div class="quota-title">额度即将耗尽</div><div class="quota-desc">剩余 ${quotaLeft}%，预计还能进行 1 次对话。</div></div>
          </div>`;
      }

      chatInner.innerHTML += `
        <div class="message ai">
          <div class="msg-avatar">N</div>
          <div class="msg-body">
            <div class="bubble">收到你的消息。这是前端静态模拟的回复。<br>${isWebSearchOn ? '（已开启联网搜索）' : ''}</div>
            ${alertHtml}
          </div>
        </div>`;
      scrollToBottom();
    }, 500);
  }

  // 4. 时间轴节点（右侧用户对话列表）
  function addTimelineDot(targetId, text) {
    const dot = document.createElement('div');
    dot.className = 'timeline-dot';
    dot.dataset.title = text.length > 20 ? text.slice(0, 20) + '...' : text;
    dot.onclick = () => {
      document.getElementById(targetId).scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    timeline.appendChild(dot);
  }

  // 5. 滚动监听：控制回到底部按钮显隐
  chatScroll.addEventListener('scroll', () => {
    const isNearBottom = chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < 100;
    scrollBottomBtn.classList.toggle('show', !isNearBottom);
  });

  scrollBottomBtn.addEventListener('click', () => {
    chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: 'smooth' });
  });

  function scrollToBottom() {
    chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: 'smooth' });
  }
</script>
</body>
</html>

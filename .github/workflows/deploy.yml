# Deploy: roll an already-built image tag out to the server. Never builds anything.
#
# The five images for that tag must exist in GHCR (run Build / Release first). One of them
# is the deploy kit (compose files + ops scripts): the host unpacks it with
# `docker create` + `docker cp`, so there is no git checkout on the server. preflight
# verifies all five before touching the host.
#
# Server side (same commands as deploy/README.md §5):
#   docker pull/create/cp kit          syncs the deploy kit; .env, keys/ and content/ untouched
#   check-env.sh                       env gate
#   compose config -q / --images       structure + the image refs that will be used
#   infra -> account -> app            pull + up -d --no-build, then health checks
#
# Deploy kit follows the tag: rolling back an image also rolls back its compose files
# (both come from the same kit image), so the two can no longer drift apart.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default latest; for rollback use a previous commit sha)'
        required: false
        default: 'latest'
      skip_preflight:
        description: 'Skip the image-exists check (use when GHCR packages are not linked to this repo)'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      tag:
        description: 'Image tag to deploy'
        required: false
        type: string
        default: 'latest'
      skip_preflight:
        description: 'Skip the image-exists check'
        required: false
        type: boolean
        default: false
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      GHCR_USER:
        required: false
      GHCR_PAT:
        required: false

  # ---------------- auto trigger (disabled) ----------------
  # Deploy automatically after a successful build. If you enable it, the tag must
  # come from the triggering run (github.event.workflow_run.head_sha), otherwise
  # every deploy lands on `latest` and rollback loses its meaning.
  # workflow_run:
  #   workflows: [Build]
  #   types: [completed]
  #   branches: [main]

# Deploys are globally serial. This group is declared here only: release.yml must
# not declare the same group, or caller and callee wait on each other.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/nitrowater' }}
  # Set to `edge` when the infra compose brings its own 80/443 proxy; empty otherwise.
  COMPOSE_PROFILE: ${{ vars.COMPOSE_PROFILE || '' }}

jobs:
  # ---------------------------------------------------------------------------
  # preflight: fail here instead of on the server
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight (images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${RAW_TAG:-latest}"
          case "$tag" in
            ''|*[!A-Za-z0-9._-]*) echo "::error::invalid tag: $tag"; exit 1 ;;
          esac
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$tag"
            echo "repo=$repo"
          } >> "$GITHUB_OUTPUT"
          echo "target: ghcr.io/$repo/*:$tag"

      - uses: docker/login-action@v3
        if: ${{ !inputs.skip_preflight }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 5 images must already exist
        if: ${{ !inputs.skip_preflight }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ steps.resolve.outputs.repo }}
        run: |
          set -eu
          missing=0
          for svc in account resource server bff kit; do
            ref="ghcr.io/$REPO/$svc:$TAG"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "ok    $ref"
            else
              echo "::error::missing $ref (run Build with the same tag first)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

  # ---------------------------------------------------------------------------
  # deploy: ssh, pull, up -d --no-build
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy (ssh)
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Passed through `envs` (never inlined into the script: secrets would hit the log).
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # compose reads ACCOUNT_IMAGE_TAG / APP_IMAGE_TAG (not IMAGE_TAG), and process
          # env wins over --env-file, so this overrides whatever the server .env says.
          ACCOUNT_IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
          APP_IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
          DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
          COMPOSE_PROFILE: ${{ env.COMPOSE_PROFILE }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 30s
          command_timeout: 30m
          envs: REGISTRY,GITHUB_REPOSITORY,ACCOUNT_IMAGE_TAG,APP_IMAGE_TAG,DEPLOY_ROOT,COMPOSE_PROFILE,GHCR_USER,GHCR_PAT
          script: |
            # The remote side is usually sh: POSIX only (no arrays, no ${var,,}).
            set -eu

            cd "$DEPLOY_ROOT"

            # compose image refs use ${REGISTRY}/${GITHUB_REPOSITORY}; the org must be lowercase.
            GITHUB_REPOSITORY="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            export GITHUB_REPOSITORY

            if [ -n "${GHCR_PAT:-}" ]; then
              echo '==> docker login ghcr.io'
              printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "${GHCR_USER:?GHCR_USER is required when GHCR_PAT is set}" --password-stdin
            fi

            # Deploy kit = compose files + ops scripts, shipped as an image: no git on the host.
            # `docker cp` merges into deploy/; .env, keys/ and content/ are host state and stay.
            KIT_REF="${REGISTRY}/${GITHUB_REPOSITORY}/kit:${ACCOUNT_IMAGE_TAG}"
            echo "==> deploy kit: ${KIT_REF}"
            mkdir -p deploy
            docker pull "$KIT_REF"
            docker rm -f nitrowater-kit >/dev/null 2>&1 || true
            docker create --name nitrowater-kit "$KIT_REF" >/dev/null
            docker cp nitrowater-kit:/deploy/. deploy/
            docker rm -f nitrowater-kit >/dev/null

            echo "==> images: ${REGISTRY}/${GITHUB_REPOSITORY}/* tag=${ACCOUNT_IMAGE_TAG}"

            # When the env is split in two files, both go to compose (the latter wins);
            # shell environment variables still have the highest priority.
            ENV_ARGS="--env-file deploy/docker/.env"
            if [ -f deploy/docker/.env.prod.secrets ]; then
              ENV_ARGS="$ENV_ARGS --env-file deploy/docker/.env.prod.secrets"
            fi

            PROFILE_ARGS=""
            if [ -n "${COMPOSE_PROFILE:-}" ]; then
              PROFILE_ARGS="--profile ${COMPOSE_PROFILE}"
            fi

            wait_http() {
              tries=0
              limit="${2:-60}"
              while [ "$tries" -lt "$limit" ]; do
                if curl -fsS -o /dev/null "$1"; then
                  echo "    ready: $1"
                  return 0
                fi
                tries=$((tries + 1))
                sleep 3
              done
              echo "    TIMEOUT: $1 (after $((limit * 3))s)"
              return 1
            }

            wait_healthy() {
              tries=0
              while [ "$tries" -lt 40 ]; do
                if [ "$(docker inspect -f '{{.State.Health.Status}}' "$1" 2>/dev/null || echo missing)" = "healthy" ]; then
                  echo "    healthy: $1"
                  return 0
                fi
                tries=$((tries + 1))
                sleep 3
              done
              echo "    TIMEOUT: $1 never became healthy"
              docker logs --tail 50 "$1" || true
              return 1
            }

            echo '==> gate 1/2: vars and content (deploy/bin/check-env.sh)'
            bash deploy/bin/check-env.sh

            echo '==> gate 2/2: compose structure'
            for unit in infra account app; do
              docker compose $ENV_ARGS $PROFILE_ARGS -f "deploy/docker/docker-compose.$unit.yml" config -q
            done

            # The only place a `your-org/nitrowater` fallback (missing REGISTRY /
            # GITHUB_REPOSITORY in .env) becomes visible before the pull.
            echo '==> resolved images'
            for unit in account app; do
              docker compose $ENV_ARGS $PROFILE_ARGS -f "deploy/docker/docker-compose.$unit.yml" config --images
            done

            # Fixed order: infra -> account (bff fetches discovery at boot) -> app.
            # No --remove-orphans: with a profile mismatch it would delete nginx-proxy/acme.
            for unit in infra account app; do
              echo "==> ${unit}: pull"
              docker compose $ENV_ARGS $PROFILE_ARGS -f "deploy/docker/docker-compose.$unit.yml" pull
              echo "==> ${unit}: up -d"
              docker compose $ENV_ARGS $PROFILE_ARGS -f "deploy/docker/docker-compose.$unit.yml" up -d --no-build
              if [ "$unit" = "account" ]; then
                wait_http http://127.0.0.1:8090/.well-known/openid-configuration 60
              fi
            done

            echo '==> verify'
            wait_http http://127.0.0.1:8080/api/public/ping 100
            wait_healthy nitrowater-bff

            echo '==> prune images older than 24h'
            docker image prune -af --filter 'until=24h'

            echo "==> done: ${APP_IMAGE_TAG}"

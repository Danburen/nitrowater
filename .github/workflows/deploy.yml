# Deploy: roll an already-built image tag out to the server. Never builds anything.
#
# The five images for that tag must exist in GHCR (run Build / Release first). One of them
# is the deploy kit (compose files + ops scripts): the host unpacks it with
# `docker create` + `docker cp`, so there is no git checkout on the server. preflight
# verifies all five before touching the host.
#
# Server side: two steps, one of which is the same command a manual deploy uses.
#   docker pull/create/cp kit   bootstrap the deploy kit; .env, keys/ and content/ untouched
#   deploy/bin/deploy.sh        gates -> compose config --images -> infra/account/app
#                               pull + up -d --no-build -> health checks -> prune
# Nothing of that sequence lives in this YAML, so CI and a manual release cannot drift apart.
#
# Deploy kit follows the tag: rolling back an image also rolls back its compose files
# (both come from the same kit image), so the two can no longer drift apart.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default latest; for rollback use a previous commit sha)'
        required: false
        default: 'latest'
      skip_preflight:
        description: 'Skip the image-exists check (use when GHCR packages are not linked to this repo)'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      tag:
        description: 'Image tag to deploy'
        required: false
        type: string
        default: 'latest'
      skip_preflight:
        description: 'Skip the image-exists check'
        required: false
        type: boolean
        default: false
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      GHCR_USER:
        required: false
      GHCR_PAT:
        required: false

  # ---------------- auto trigger (disabled) ----------------
  # Deploy automatically after a successful build. If you enable it, the tag must
  # come from the triggering run (github.event.workflow_run.head_sha), otherwise
  # every deploy lands on `latest` and rollback loses its meaning.
  # workflow_run:
  #   workflows: [Build]
  #   types: [completed]
  #   branches: [main]

# Deploys are globally serial. This group is declared here only: release.yml must
# not declare the same group, or caller and callee wait on each other.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/nitrowater' }}
  # Set to `edge` when the infra compose brings its own 80/443 proxy; empty otherwise.
  COMPOSE_PROFILE: ${{ vars.COMPOSE_PROFILE || '' }}

jobs:
  # ---------------------------------------------------------------------------
  # preflight: fail here instead of on the server
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight (images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${RAW_TAG:-latest}"
          case "$tag" in
            ''|*[!A-Za-z0-9._-]*) echo "::error::invalid tag: $tag"; exit 1 ;;
          esac
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$tag"
            echo "repo=$repo"
          } >> "$GITHUB_OUTPUT"
          echo "target: ghcr.io/$repo/*:$tag"

      - uses: docker/login-action@v3
        if: ${{ !inputs.skip_preflight }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 5 images must already exist
        if: ${{ !inputs.skip_preflight }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ steps.resolve.outputs.repo }}
        run: |
          set -eu
          missing=0
          for svc in account resource server bff kit; do
            ref="ghcr.io/$REPO/$svc:$TAG"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "ok    $ref"
            else
              echo "::error::missing $ref (run Build with the same tag first)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

  # ---------------------------------------------------------------------------
  # deploy: ssh, pull, up -d --no-build
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy (ssh)
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Passed through `envs` (never inlined into the script: secrets would hit the log).
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # compose reads ACCOUNT_IMAGE_TAG / APP_IMAGE_TAG (not IMAGE_TAG), and process
          # env wins over --env-file, so this overrides whatever the server .env says.
          ACCOUNT_IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
          APP_IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
          DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
          COMPOSE_PROFILE: ${{ env.COMPOSE_PROFILE }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 30s
          command_timeout: 30m
          envs: REGISTRY,GITHUB_REPOSITORY,ACCOUNT_IMAGE_TAG,APP_IMAGE_TAG,DEPLOY_ROOT,COMPOSE_PROFILE,GHCR_USER,GHCR_PAT
          script: |
            # The remote side is usually sh: POSIX only (no arrays, no ${var,,}).
            set -eu

            cd "$DEPLOY_ROOT"

            # compose image refs use ${REGISTRY}/${GITHUB_REPOSITORY}; the org must be lowercase.
            GITHUB_REPOSITORY="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            export GITHUB_REPOSITORY

            if [ -n "${GHCR_PAT:-}" ]; then
              echo '==> docker login ghcr.io'
              printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "${GHCR_USER:?GHCR_USER is required when GHCR_PAT is set}" --password-stdin
            fi

            # Deploy kit = compose files + ops scripts, shipped as an image: no git on the host.
            # `docker cp` merges into deploy/; .env, keys/ and content/ are host state and stay.
            # The image is FROM scratch (no shell, no binaries), so `docker create` needs a
            # throwaway command: it refuses an image without one ("no command specified").
            # The container is never started - it exists only for `docker cp`.
            KIT_REF="${REGISTRY}/${GITHUB_REPOSITORY}/kit:${ACCOUNT_IMAGE_TAG}"
            echo "==> deploy kit: ${KIT_REF}"
            mkdir -p deploy
            docker pull "$KIT_REF"
            docker rm -f nitrowater-kit >/dev/null 2>&1 || true
            docker create --name nitrowater-kit "$KIT_REF" unused >/dev/null
            docker cp nitrowater-kit:/deploy/. deploy/
            docker rm -f nitrowater-kit >/dev/null

            # Everything after the bootstrap lives in deploy/bin/deploy.sh: one entry point
            # shared with a manual deploy, so the sequence cannot drift between CI and ops.
            echo '==> release (deploy/bin/deploy.sh)'
            if [ -n "${COMPOSE_PROFILE:-}" ]; then
              bash deploy/bin/deploy.sh --tag "$ACCOUNT_IMAGE_TAG" --profile "$COMPOSE_PROFILE" --skip-kit
            else
              bash deploy/bin/deploy.sh --tag "$ACCOUNT_IMAGE_TAG" --skip-kit
            fi

# ============================================================
# NitroWater Deploy —— 只部署**已经构建好**的镜像，不做任何 build。
#
# 触发（都是手动；自动触发见下方 `on:` 里的注释）：
#   - workflow_dispatch：Actions → Deploy → Run workflow（填 tag）
#   - workflow_call   ：被 release.yml 复用（build 成功后紧接着部署）
#
# 前置：同 tag 的 4 个镜像必须在 GHCR 里（先跑 build.yml / release.yml）。
#       preflight 会 `docker manifest inspect` 逐个确认，缺一个就中止，不 SSH。
#
# 服务器侧行为（与 deploy/README.md §5 的手工命令逐字一致）：
#   git reset --hard origin/<branch>   ← 部署包（compose / 脚本）跟 git，不跟镜像
#   bash deploy/bin/check-env.sh       ← 门禁
#   compose config -q                  ← 结构 + 插值
#   infra → account → app  pull + up -d --no-build
#   探活 → 清 24h 前的旧镜像
#
# ⚠ 部署包跟 DEPLOY_BRANCH，镜像跟 tag。回滚 = 把 tag 填成上一个提交的 sha 再跑一次。
#
# 一次性准备（服务器 / 仓库设置）见 deploy/README.md §12。
# ============================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要部署的镜像 tag（默认 latest；回滚填上一个提交的 sha）'
        required: false
        default: 'latest'
      skip_preflight:
        description: '跳过「镜像已存在」预检（GHCR 包未链接到本仓库时会误报缺失）'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      tag:
        description: '要部署的镜像 tag'
        required: false
        type: string
        default: 'latest'
      skip_preflight:
        description: '跳过镜像存在性预检'
        required: false
        type: boolean
        default: false
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      GHCR_USER:
        required: false
      GHCR_PAT:
        required: false

  # ---------------- 自动触发（暂不启用，需要时取消注释） ----------------
  # 「build 跑完就自动部署」——注意这会绕过人工确认，且每次构建都会直接上线。
  # 真要开的时候，tag 不能再用默认值：把下面 preflight 的 RAW_TAG 改成
  #   ${{ github.event.workflow_run.head_sha }}
  # 否则每次都会部署 latest（= 最后一次构建），回滚语义就没了。
  # workflow_run:
  #   workflows: [Build]
  #   types: [completed]
  #   branches: [main]

# 部署全局串行：同一时刻只允许一个上线/回滚在跑。
# 注意：本组只在 deploy.yml 里声明，release.yml 不声明同名组——
# 调用方与被执行方持同一组会互相等待（GitHub 明确警告的死锁场景）。
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/nitrowater' }}
  DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
  # 用 docker 自带 edge（nginx-proxy + acme，占 80/443）时把它设成 edge；用自建反代就留空。
  COMPOSE_PROFILE: ${{ vars.COMPOSE_PROFILE || '' }}

jobs:
  # ================================================================
  # Job 1: preflight —— 确认「要部署的东西真的存在」，失败不碰服务器
  # ================================================================
  preflight:
    name: preflight (images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${RAW_TAG:-latest}"
          case "$tag" in
            ''|*[!A-Za-z0-9._-]*)
              echo "::error::invalid tag: $tag（只允许 A-Za-z0-9._-）"
              exit 1
              ;;
          esac
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "target: ghcr.io/$repo/*:$tag"

      - uses: docker/login-action@v3
        if: ${{ !inputs.skip_preflight }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 4 images must already exist
        if: ${{ !inputs.skip_preflight }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ steps.resolve.outputs.repo }}
        run: |
          set -eu
          missing=0
          for svc in account resource server bff; do
            ref="ghcr.io/$REPO/$svc:$TAG"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "ok    $ref"
            else
              echo "::error::missing $ref —— 先跑 Build（同 tag）"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

  # ================================================================
  # Job 2: deploy —— SSH 到服务器，pull 已构建好的镜像并 up -d
  # ================================================================
  deploy:
    name: deploy (ssh)
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # 通过 envs 注入到远端脚本（不要把这些值直接写进 script，密钥会进日志）
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # compose 读的是 ACCOUNT_IMAGE_TAG / APP_IMAGE_TAG（不是 IMAGE_TAG），
          # 进程环境变量优先级高于 --env-file，所以这里注入就能覆盖服务器 .env 里的旧值。
          ACCOUNT_IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
          APP_IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
          DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          COMPOSE_PROFILE: ${{ env.COMPOSE_PROFILE }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 30s
          command_timeout: 30m
          envs: REGISTRY,GITHUB_REPOSITORY,ACCOUNT_IMAGE_TAG,APP_IMAGE_TAG,DEPLOY_ROOT,DEPLOY_BRANCH,COMPOSE_PROFILE,GHCR_USER,GHCR_PAT
          script: |
            # 远端一般是 sh：这里只用 POSIX 语法（无数组、无 ${var,,}）。
            set -eu

            cd "$DEPLOY_ROOT"

            echo "==> deploy kit: origin/${DEPLOY_BRANCH}"
            git fetch --prune origin
            git reset --hard "origin/${DEPLOY_BRANCH}"

            # compose 里 image: ${REGISTRY}/${GITHUB_REPOSITORY}/... ，组织名必须全小写
            GITHUB_REPOSITORY="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            export GITHUB_REPOSITORY
            echo "==> images: ${REGISTRY}/${GITHUB_REPOSITORY}/* tag=${ACCOUNT_IMAGE_TAG}"

            if [ -n "${GHCR_PAT:-}" ]; then
              echo '==> docker login ghcr.io'
              printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "${GHCR_USER:?GHCR_USER is required when GHCR_PAT is set}" --password-stdin
            fi

            # 拆两个 env 文件时，两个都要传给 compose（后者覆盖前者）；shell 环境变量优先级最高。
            ENV_ARGS="--env-file deploy/docker/.env"
            if [ -f deploy/docker/.env.prod.secrets ]; then
              ENV_ARGS="$ENV_ARGS --env-file deploy/docker/.env.prod.secrets"
            fi

            PROFILE_ARGS=""
            if [ -n "${COMPOSE_PROFILE:-}" ]; then
              PROFILE_ARGS="--profile ${COMPOSE_PROFILE}"
            fi

            wait_http() {
              tries=0
              limit="${2:-60}"
              while [ "$tries" -lt "$limit" ]; do
                if curl -fsS -o /dev/null "$1"; then
                  echo "    ready: $1"
                  return 0
                fi
                tries=$((tries + 1))
                sleep 3
              done
              echo "    TIMEOUT: $1 (after $((limit * 3))s)"
              return 1
            }

            wait_healthy() {
              tries=0
              while [ "$tries" -lt 40 ]; do
                if [ "$(docker inspect -f '{{.State.Health.Status}}' "$1" 2>/dev/null || echo missing)" = "healthy" ]; then
                  echo "    healthy: $1"
                  return 0
                fi
                tries=$((tries + 1))
                sleep 3
              done
              echo "    TIMEOUT: $1 never became healthy"
              docker logs --tail 50 "$1" || true
              return 1
            }

            echo '==> gate 1/2: 变量与内容（deploy/bin/check-env.sh）'
            bash deploy/bin/check-env.sh

            echo '==> gate 2/2: compose 结构 + 插值'
            for unit in infra account app; do
              docker compose $ENV_ARGS $PROFILE_ARGS -f "deploy/docker/docker-compose.$unit.yml" config -q
            done

            # 打印 compose 实际会用的镜像引用：这里是唯一能当场看出
            # 「.env 没写 REGISTRY/GITHUB_REPOSITORY → 回落 your-org/nitrowater」的地方。
            echo '==> resolved images'
            for unit in account app; do
              docker compose $ENV_ARGS $PROFILE_ARGS -f "deploy/docker/docker-compose.$unit.yml" config --images
            done

            # 顺序固定：infra → account（bff 启动要拉 discovery）→ app
            # 不用 --remove-orphans：profile 不匹配时它会把 nginx-proxy/acme 当孤儿删掉。
            for unit in infra account app; do
              echo "==> ${unit}: pull"
              docker compose $ENV_ARGS $PROFILE_ARGS -f "deploy/docker/docker-compose.$unit.yml" pull
              echo "==> ${unit}: up -d"
              docker compose $ENV_ARGS $PROFILE_ARGS -f "deploy/docker/docker-compose.$unit.yml" up -d --no-build
              if [ "$unit" = "account" ]; then
                wait_http http://127.0.0.1:8090/.well-known/openid-configuration 60
              fi
            done

            echo '==> verify'
            wait_http http://127.0.0.1:8080/api/public/ping 100
            wait_healthy nitrowater-bff

            echo '==> prune images older than 24h'
            docker image prune -af --filter 'until=24h'

            echo "==> done: ${APP_IMAGE_TAG}"

# Deploy: roll an already-built image tag out to the server. Never builds anything.
#
# The four images for that tag must exist in GHCR (run Build / Release first);
# preflight verifies all four before touching the host.
#
# Server side: three steps.
#   checkout + tar + scp        ship deploy/ from the commit being deployed
#   tar -xzf /tmp/...           merge it into DEPLOY_ROOT; .env, keys/, content/, backups/ untouched
#   deploy/bin/deploy.sh        gates -> MySQL backup -> compose config --images
#                               -> infra/account/app pull + up -d --no-build -> health checks -> prune
# Nothing of that sequence lives in this YAML, so CI and a manual release cannot drift apart.
#
# The commit is the alignment unit: images carry <tag>/<sha>, deploy/ comes from the
# same ref. Rolling back means deploying that tag with `ref` set to the same commit,
# so compose files, scripts and docs match the images again.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default latest; for rollback use a previous commit sha)'
        required: false
        default: 'latest'
      ref:
        description: 'Git ref/sha to take deploy/ from (default: the commit this run is on)'
        required: false
        default: ''
      skip_preflight:
        description: 'Skip the image-exists check (use when GHCR packages are not linked to this repo)'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      tag:
        description: 'Image tag to deploy'
        required: false
        type: string
        default: 'latest'
      ref:
        description: 'Git ref/sha to take deploy/ from (empty = this run commit)'
        required: false
        type: string
        default: ''
      skip_preflight:
        description: 'Skip the image-exists check'
        required: false
        type: boolean
        default: false
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      GHCR_USER:
        required: false
      GHCR_PAT:
        required: false

  # ---------------- auto trigger (disabled) ----------------
  # Deploy automatically after a successful build. If you enable it, the tag must
  # come from the triggering run (github.event.workflow_run.head_sha), otherwise
  # every deploy lands on `latest` and rollback loses its meaning.
  # workflow_run:
  #   workflows: [Build]
  #   types: [completed]
  #   branches: [main]

# Deploys are globally serial. This group is declared here only: release.yml must
# not declare the same group, or caller and callee wait on each other.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/nitrowater' }}
  # Set to `edge` when the infra compose brings its own 80/443 proxy; empty otherwise.
  COMPOSE_PROFILE: ${{ vars.COMPOSE_PROFILE || '' }}

jobs:
  # ---------------------------------------------------------------------------
  # preflight: fail here instead of on the server
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight (images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${RAW_TAG:-latest}"
          case "$tag" in
            ''|*[!A-Za-z0-9._-]*) echo "::error::invalid tag: $tag"; exit 1 ;;
          esac
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$tag"
            echo "repo=$repo"
          } >> "$GITHUB_OUTPUT"
          echo "target: ghcr.io/$repo/*:$tag"

      - uses: docker/login-action@v3
        if: ${{ !inputs.skip_preflight }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 4 images must already exist
        if: ${{ !inputs.skip_preflight }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ steps.resolve.outputs.repo }}
        run: |
          set -eu
          missing=0
          for svc in account resource server bff; do
            ref="ghcr.io/$REPO/$svc:$TAG"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "ok    $ref"
            else
              echo "::error::missing $ref (run Build with the same tag first)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

  # ---------------------------------------------------------------------------
  # deploy: ssh, pull, up -d --no-build
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy (ssh)
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      # The host keeps no git checkout, so deploy/ is shipped from the commit being
      # deployed. `ref` defaults to this run's commit; for a rollback pass the commit
      # that produced the images (or the git tag name).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Bundle deploy/
        run: tar -czf /tmp/nitrowater-deploy.tgz -C . deploy

      - name: Copy bundle to host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -q -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            /tmp/nitrowater-deploy.tgz "$SSH_USER@$SSH_HOST:/tmp/nitrowater-deploy.tgz"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Passed through `envs` (never inlined into the script: secrets would hit the log).
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # compose reads ACCOUNT_IMAGE_TAG / APP_IMAGE_TAG (not IMAGE_TAG), and process
          # env wins over --env-file, so this overrides whatever the server .env says.
          ACCOUNT_IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
          APP_IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
          DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
          COMPOSE_PROFILE: ${{ env.COMPOSE_PROFILE }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 30s
          command_timeout: 30m
          envs: REGISTRY,GITHUB_REPOSITORY,ACCOUNT_IMAGE_TAG,APP_IMAGE_TAG,DEPLOY_ROOT,COMPOSE_PROFILE,GHCR_USER,GHCR_PAT
          script: |
            # The remote side is usually sh: POSIX only (no arrays, no ${var,,}).
            set -eu

            cd "$DEPLOY_ROOT"

            # compose image refs use ${REGISTRY}/${GITHUB_REPOSITORY}; the org must be lowercase.
            GITHUB_REPOSITORY="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            export GITHUB_REPOSITORY

            if [ -n "${GHCR_PAT:-}" ]; then
              echo '==> docker login ghcr.io'
              printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "${GHCR_USER:?GHCR_USER is required when GHCR_PAT is set}" --password-stdin
            fi

            # deploy/ arrives as a tarball from the same commit as the images. It is
            # extracted in place (merge): tracked files are overwritten, while .env,
            # keys/, content/ and backups/ are host state and are not in the bundle.
            echo '==> sync deploy/ from the workflow commit'
            tar -xzf /tmp/nitrowater-deploy.tgz
            rm -f /tmp/nitrowater-deploy.tgz

            # Everything after that lives in deploy/bin/deploy.sh: one entry point
            # shared with a manual deploy, so the sequence cannot drift between CI and ops.
            echo '==> release (deploy/bin/deploy.sh)'
            if [ -n "${COMPOSE_PROFILE:-}" ]; then
              bash deploy/bin/deploy.sh --tag "$ACCOUNT_IMAGE_TAG" --profile "$COMPOSE_PROFILE"
            else
              bash deploy/bin/deploy.sh --tag "$ACCOUNT_IMAGE_TAG"
            fi

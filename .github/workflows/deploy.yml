# Deploy: roll an already-built image tag out to the host. Never builds anything.
#
# One SSH session does the whole sequence (nothing of it is duplicated in docs):
#   ship deploy/   tar + scp, merged into DEPLOY_ROOT (.env / keys/ / content/ / backups stay)
#   gate           deploy/bin/check-env.sh
#   pull           the four images of <tag> — all of them, before any container is touched
#   backup         deploy/bin/backup_mysql.sh (the only pre-Flyway recovery point)
#   apply          account -> app, `up -d --no-build` (infra is deployed by hand, see deploy/README.md)
#   restart        every nitrowater-* container gets `unless-stopped` (host reboots daily)
#   verify         account discovery, /api/public/ping, bff health — a red bff fails the run
#
# Tag resolution (in order):
#   tag set        -> that tag (a version like v1.2.3, or a sha)
#   ref set        -> the images that commit produced (rollback)
#   neither        -> `latest`, i.e. the newest build; nothing has to be built first
#
# `gh workflow run deploy.yml` therefore just re-ships the current build; use
# Release when the commit has new code (it builds, then deploys the identical sha).
# deploy/ always comes from this commit, so a `latest` that predates it logs a
# warning instead of silently mixing an old image with new config.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (empty = `latest`, or the images of `ref` when ref is set)'
        required: false
        default: ''
      ref:
        description: 'Git ref/sha to deploy deploy/ from (empty = this run''s commit)'
        required: false
        default: ''
      skip_preflight:
        description: 'Skip the image-exists check (use when GHCR packages are not linked to this repo)'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      tag:
        description: 'Image tag (empty = latest, or the images of `ref`)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref/sha to deploy deploy/ from (empty = this run''s commit)'
        required: false
        type: string
        default: ''
      skip_preflight:
        description: 'Skip the image-exists check'
        required: false
        type: boolean
        default: false
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      SSH_FINGERPRINT:
        required: false
      GHCR_USER:
        required: false
      GHCR_PAT:
        required: false

# Deploys are globally serial. This group is declared here only: release.yml must
# not declare the same group, or caller and callee wait on each other.
concurrency:
  group: deploy
  cancel-in-progress: false

# Nothing here needs the default write-scoped GITHUB_TOKEN; jobs narrow this further.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/nitrowater' }}

jobs:
  # ---------------------------------------------------------------------------
  # preflight: resolve the tag, then fail here instead of on the server
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight (images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # The deploy job checks out the same ref, and the `ref` branch of resolve uses its
      # sha, so the checkout has to happen first.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - id: resolve
        env:
          # Both come from form inputs: read via env, never inline them in the script.
          RAW_TAG: ${{ inputs.tag }}
          RAW_REF: ${{ inputs.ref }}
        run: |
          set -eu
          sha="$(git rev-parse HEAD)"
          if [ -n "$RAW_TAG" ]; then
            tag="$RAW_TAG"; why="input tag"
          elif [ -n "$RAW_REF" ]; then
            # Rollback: the images that this commit produced.
            tag="$sha"; why="images of $RAW_REF"
          else
            # Default: whatever Build/Release pushed last — no build needed first.
            tag="latest"; why="newest build"
          fi
          # It ends up in a docker tag, so whitelist the allowed characters.
          case "$tag" in
            ''|*[!A-Za-z0-9._-]*) echo "::error::invalid tag: $tag"; exit 1 ;;
          esac
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "repo=$repo"
          } >> "$GITHUB_OUTPUT"
          echo "images: ghcr.io/$repo/*:$tag ($why); deploy/ from $sha"

      - uses: docker/login-action@v3
        if: ${{ !inputs.skip_preflight }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 4 images must already exist
        if: ${{ !inputs.skip_preflight }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ steps.resolve.outputs.repo }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -eu
          missing=0
          for svc in account resource server bff; do
            ref="ghcr.io/$REPO/$svc:$TAG"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null || echo n/a)"
              echo "ok    $ref  $digest"
            else
              echo "::error::missing $ref (run Release, or Build with tag $TAG first)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # deploy/ comes from this commit but `latest` may predate it. Say so, so a
          # code/config mismatch is never silent.
          if [ "$TAG" = "latest" ] && [ "$TAG" != "$SHA" ]; then
            unbuilt=0
            for svc in account resource server bff; do
              docker manifest inspect "ghcr.io/$REPO/$svc:$SHA" >/dev/null 2>&1 || unbuilt=1
            done
            if [ "$unbuilt" -eq 1 ]; then
              echo "::warning::no images built for $SHA; shipping '$TAG' with deploy/ from $SHA (run Release to build this commit)"
            fi
          fi

  # ---------------------------------------------------------------------------
  # deploy: ship deploy/, pull, backup, apply, verify
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy (ssh)
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Bundle deploy/
        # git archive, not tar: only tracked files. tar would also pack any local
        # deploy/docker/.env or deploy/keys/*.key that happens to exist in the workspace.
        run: git archive --format=tar.gz -o /tmp/nitrowater-deploy.tgz HEAD deploy

      - name: SSH secrets present
        env:
          # Host/user are not really secret, so the Variables tab is accepted too.
          # The private key must be a Secret (variables are readable by everyone).
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -eu
          echo "repo:     $GITHUB_REPOSITORY"
          echo "workflow: $GITHUB_WORKFLOW_REF"
          missing=""
          check() {
            if [ -n "$2" ]; then
              echo "    ok       $1 (${#2} chars)"
            else
              echo "    MISSING  $1"
              missing="$missing $1"
            fi
          }
          check SSH_HOST "$SSH_HOST"
          check SSH_USER "$SSH_USER"
          check SSH_KEY  "$SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing - looked in Settings -> Secrets and variables -> Actions, both repo scope and the 'production' environment. SSH_KEY has to be a Secret holding the private key, not a Variable."
            exit 1
          fi

      - name: Copy bundle to host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |-
          set -eu
          # The bundle carries no secrets (tracked files only), but the private key must not
          # live on the runner: keep it in $RUNNER_TEMP and delete it on every exit path.
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT

          # A flaky link to the host is the usual cause here: retry the transfer a few
          # times, then give up instead of hammering it.
          attempt=1
          max=3
          while :; do
            echo "==> scp attempt $attempt/$max"
            if scp -q -i "$key" -o BatchMode=yes -o ConnectTimeout=20 \
                 -o StrictHostKeyChecking=accept-new \
                 /tmp/nitrowater-deploy.tgz "$SSH_USER@$SSH_HOST:/tmp/nitrowater-deploy.tgz"; then
              echo "    ok"
              exit 0
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::scp failed after $max attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 10
          done

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # compose reads ACCOUNT_IMAGE_TAG / APP_IMAGE_TAG (not IMAGE_TAG), and process
          # env wins over --env-file, so this overrides whatever the server .env says.
          ACCOUNT_IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
          APP_IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
          DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Pin the host key when the secret is set (optional; empty = TOFU like scp above).
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          timeout: 30s
          command_timeout: 30m
          envs: REGISTRY,GITHUB_REPOSITORY,ACCOUNT_IMAGE_TAG,APP_IMAGE_TAG,DEPLOY_ROOT,GHCR_USER,GHCR_PAT
          script: |-
            # The remote side is usually sh: POSIX only (no arrays, no ${var,,}).
            set -eu

            cd "$DEPLOY_ROOT"
            TAG="${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}"

            # compose image refs use ${REGISTRY}/${GITHUB_REPOSITORY}; the org must be lowercase.
            GITHUB_REPOSITORY="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            export GITHUB_REPOSITORY

            if [ -n "${GHCR_PAT:-}" ]; then
              echo '==> docker login ghcr.io'
              printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "${GHCR_USER:?GHCR_USER is required when GHCR_PAT is set}" --password-stdin
              # The token is only needed for the pull; keep it out of the rest of the session
              # so a later `env` dump / failing command cannot surface it.
              unset GHCR_PAT
            fi

            # Fail here — with the host's own credentials, before anything is replaced —
            # instead of in the middle of the pull.
            echo '==> images'
            for svc in account resource server bff; do
              img="$REGISTRY/$GITHUB_REPOSITORY/$svc:$TAG"
              docker manifest inspect "$img" >/dev/null || { echo "ERROR: not visible from this host: $img" >&2; exit 1; }
              echo "    ok $img"
            done

            # deploy/ arrives as a tarball from the same commit as the images. The documentation
            # corpora are tracked, so a renamed/deleted markdown file has to disappear here too
            # (tar merges into the existing tree). .env, keys/, content/moderation/ and backups/
            # are host state and are not in the bundle.
            rm -rf deploy/content/docs
            echo '==> sync deploy/ from the workflow commit'
            tar -xzf /tmp/nitrowater-deploy.tgz
            rm -f /tmp/nitrowater-deploy.tgz

            echo '==> gate: vars and content (deploy/bin/check-env.sh)'
            bash deploy/bin/check-env.sh

            # Pull everything first: a failed pull must leave the running containers alone
            # (pulling per unit would leave a new account next to an old server).
            echo '==> pull'
            for svc in account resource server bff; do
              docker pull "$REGISTRY/$GITHUB_REPOSITORY/$svc:$TAG"
            done

            ENVF="--env-file deploy/docker/.env"
            [ -f deploy/docker/.env.prod.secrets ] && ENVF="$ENVF --env-file deploy/docker/.env.prod.secrets"

            # Flyway runs inside the app on boot, so this dump is the only recovery point for a
            # release that changes the schema. A missing container means "not deployed yet".
            if docker inspect -f '{{.State.Running}}' nitrowater-mysql >/dev/null 2>&1; then
              echo '==> backup: MySQL dump before replacing containers'
              bash deploy/bin/backup_mysql.sh
            else
              echo '==> backup: skipped (nitrowater-mysql not found)'
            fi

            echo '==> account: up -d --no-build'
            docker compose $ENVF -f deploy/docker/docker-compose.account.yml up -d --no-build
            # bff fetches this at boot; wait for it instead of letting bff crash-loop.
            curl -fsS --retry 60 --retry-delay 3 --retry-connrefused -o /dev/null \
              http://127.0.0.1:8090/.well-known/openid-configuration

            echo '==> app: up -d --no-build'
            docker compose $ENVF -f deploy/docker/docker-compose.app.yml up -d --no-build

            # Host reboots daily: containers must come back on their own. Compose already declares
            # restart: unless-stopped; this also fixes containers created before that policy.
            echo '==> restart policy: unless-stopped'
            # A restart policy only helps if the daemon itself starts at boot.
            if command -v systemctl >/dev/null 2>&1; then
              boot="$(systemctl is-enabled docker 2>/dev/null || true)"
              [ "$boot" = "enabled" ] || echo "WARN: docker is not enabled at boot ($boot); run: sudo systemctl enable --now docker"
            fi
            for c in nitrowater-mysql nitrowater-redis \
                     nitrowater-account nitrowater-resource nitrowater-server nitrowater-bff \
                     nitrowater-docs nitrowater-qdrant nitrowater-piston \
                     nitrowater-nginx-proxy nitrowater-acme; do
              docker inspect "$c" >/dev/null 2>&1 || continue
              docker update --restart unless-stopped "$c" >/dev/null
              policy="$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$c")"
              if [ "$policy" != "unless-stopped" ]; then
                echo "ERROR: $c restart policy is $policy" >&2
                exit 1
              fi
              echo "    ok $c"
            done

            # Login sessions live in Redis: without AOF they vanish on reboot.
            if docker inspect nitrowater-redis >/dev/null 2>&1; then
              aof="$(docker inspect -f '{{json .Config.Cmd}}' nitrowater-redis)"
              case "$aof" in
                *'"--appendonly","yes"'*) echo '    ok nitrowater-redis AOF' ;;
                *) echo 'WARN: nitrowater-redis has no --appendonly yes; login sessions will not survive a reboot' ;;
              esac
            fi

            echo '==> verify'
            curl -fsS --retry 100 --retry-delay 3 --retry-connrefused -o /dev/null \
              http://127.0.0.1:8080/api/public/ping
            tries=0
            while [ "$tries" -lt 60 ]; do
              status="$(docker inspect -f '{{.State.Health.Status}}' nitrowater-bff 2>/dev/null || echo missing)"
              [ "$status" = "healthy" ] && break
              tries=$((tries + 1))
              sleep 3
            done
            if [ "$status" != "healthy" ]; then
              echo "ERROR: nitrowater-bff is $status after 180s" >&2
              docker logs --tail 50 nitrowater-bff || true
              exit 1
            fi

            # Untagged only: `-a` would also drop mysql/qdrant/piston and the next `up` would
            # re-pull piston, which has no tag pinned in compose.
            echo '==> prune untagged images older than 7 days'
            docker image prune -f --filter 'until=168h'

            echo "==> done: $TAG"

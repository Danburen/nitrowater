# Build: run the checks, then build and push five images to GHCR — the four backend
# services plus the standalone `tools` static site. Does not deploy anything.
#
# Image tags: <tag> (input, default latest) and <sha>. Roll back by deploying a
# previous sha with deploy.yml. Images are built by `docker buildx bake`
# (docker-bake.hcl) so the shared Gradle stage runs once instead of once per image.
# deploy/ is not an image: deploy.yml ships it over SSH from the same commit.
# Tests run in this workflow only — the Dockerfile builds with `-x test`.
#
# The `tools` image is consumed by EXTERNAL services on a separate origin; deploy.yml
# only pulls the four backend images into the app compose unit. Cross-site links come
# from build-time VITE_* variables, overridable with repo variables of the same name.
#
# Short-circuit: `probe` checks first whether all five <sha> tags already exist. If
# they do, every verify job and the bake are skipped and the run ends in seconds
# (only `alias` still runs, to point a requested <tag> at that sha). Rebuilding the
# same commit would not give the same digest anyway (COPY layers keep file mtimes),
# so "already pushed for this sha" is the only reliable "nothing to do" signal.
#
# Everything is manual; auto triggers are commented out in `on:` below.

name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default latest; prefer v1.2.3 or a commit sha)'
        required: false
        default: 'latest'

  workflow_call:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        type: string
        default: ''
    outputs:
      tag:
        description: 'Resolved tag (empty input falls back to latest)'
        value: ${{ jobs.resolve.outputs.tag }}
      sha:
        description: 'Commit sha, pushed as a second tag (rollback target)'
        value: ${{ jobs.resolve.outputs.sha }}

  # ---------------- auto triggers (disabled, manual only for now) ----------------
  # push:
  #   branches: [main]
  # pull_request:          # checks only: the build job is skipped (see its `if`)

# Serialize builds of the same tag; never cancel one mid-push.
concurrency:
  group: build-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # resolve: normalize the tag and the lowercase repo name
  # ---------------------------------------------------------------------------
  resolve:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      repo: ${{ steps.resolve.outputs.repo }}
    steps:
      - id: resolve
        env:
          # The tag comes from a form input: read it via env, never inline it in the script.
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${RAW_TAG:-latest}"
          # It ends up in a docker tag, so whitelist the allowed characters.
          case "$tag" in
            ''|*[!A-Za-z0-9._-]*) echo "::error::invalid tag: $tag"; exit 1 ;;
          esac
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$tag"
            echo "sha=$GITHUB_SHA"
            echo "repo=$repo"
          } >> "$GITHUB_OUTPUT"
          echo "resolved: $repo/*:$tag (sha $GITHUB_SHA)"

  # ---------------------------------------------------------------------------
  # probe: are all five <sha> images already in GHCR? If yes, skip everything.
  # ---------------------------------------------------------------------------
  probe:
    name: probe (images for sha)
    runs-on: ubuntu-latest
    needs: [resolve]
    permissions:
      contents: read
      packages: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: check
        env:
          REPO: ${{ needs.resolve.outputs.repo }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -u
          missing=0
          for svc in account resource server bff tools; do
            ref="ghcr.io/$REPO/$svc:$SHA"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "hit   $ref"
            else
              echo "miss  $ref"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo '::notice::all five images already exist for this sha — checks and bake skipped'
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # alias: images already exist for this sha, but a human-readable tag was asked
  # for. Point that tag at the existing manifest — 5 registry calls, no rebuild.
  # (Without this, `release -f tag=v1.2.3` on an already-built commit would skip
  # the bake and silently never create v1.2.3.)
  # ---------------------------------------------------------------------------
  alias:
    name: alias tag
    runs-on: ubuntu-latest
    needs: [resolve, probe]
    if: needs.probe.outputs.exists == 'true' && needs.resolve.outputs.tag != needs.resolve.outputs.sha
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - env:
          REPO: ${{ needs.resolve.outputs.repo }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -eu
          for svc in account resource server bff tools; do
            docker buildx imagetools create \
              -t "ghcr.io/$REPO/$svc:$TAG" "ghcr.io/$REPO/$svc:$SHA"
            echo "aliased $svc:$TAG -> $svc:$SHA"
          done

  # ---------------------------------------------------------------------------
  # verify: cheap gates. All five run in parallel and must pass before the build.
  # ---------------------------------------------------------------------------
  backend:
    name: backend (java 25)
    runs-on: ubuntu-latest
    needs: [probe]
    if: needs.probe.outputs.exists != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # -PskipAdminUi / -PskipAuthUi: the SPAs are built in the Dockerfile's node
      # stages, not here (that is also why this stays fast).
      - name: Build + test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace build -PskipAdminUi -PskipAuthUi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/build/reports/tests/test
            **/build/test-results/test
          retention-days: 7

  ui-web:
    name: ui-web (vue3)
    runs-on: ubuntu-latest
    needs: [probe]
    if: needs.probe.outputs.exists != 'true'
    defaults:
      run:
        working-directory: nitrowater-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same patch as the Dockerfile node stage.
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: nitrowater-web/package-lock.json

      # `build` also type-checks (vue-tsc -b). It duplicates the web-ui Docker
      # stage on purpose: bundling errors surface here in seconds, not mid-build.
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  ui-tools:
    name: ui-tools (standalone offline tools)
    runs-on: ubuntu-latest
    needs: [probe]
    if: needs.probe.outputs.exists != 'true'
    defaults:
      run:
        working-directory: nitrowater-tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same patch as nitrowater-tools/Dockerfile.
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: nitrowater-tools/package-lock.json

      # Identical to the tools Docker stage: lint first, then build (which also
      # runs vue-tsc -b), so type/bundle errors never reach the image build.
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  ui-account:
    name: ui-account (pnpm workspace)
    runs-on: ubuntu-latest
    needs: [probe]
    if: needs.probe.outputs.exists != 'true'
    defaults:
      run:
        working-directory: nitrowater-account
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.18.0'

      - uses: actions/setup-node@v4
        with:
          # Same patch as the Dockerfile node stage.
          node-version: '24.22.3'
          cache: pnpm
          cache-dependency-path: nitrowater-account/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

  guard:
    name: deploy guard
    runs-on: ubuntu-latest
    needs: [probe]
    if: needs.probe.outputs.exists != 'true'
    steps:
      - uses: actions/checkout@v4

      # --no-interpolate: validate the files themselves; real values are checked
      # on the server by deploy/bin/check-env.sh during deploy.
      - name: Validate compose files
        run: |
          for f in deploy/docker/docker-compose.*.yml; do
            echo "::group::$f"
            docker compose -f "$f" config --no-interpolate -q
            echo "::endgroup::"
          done

      - name: Shell syntax (bash -n)
        run: |
          for f in deploy/bin/*.sh bin/dev/*.sh; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            bash -n "$f"
            echo "::endgroup::"
          done

      - name: PowerShell parse (no execution)
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Path bin/dev, bin -Filter *.ps1 -File -ErrorAction SilentlyContinue |
            ForEach-Object {
              $file = $_.FullName
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
              foreach ($e in $errors) {
                $bad += "${file}:$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          if ($bad.Count) { $bad | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'all .ps1 parsed clean'

  # ---------------------------------------------------------------------------
  # build: one bake invocation -> 5 images, Gradle runs once
  # ---------------------------------------------------------------------------
  build:
    name: bake (push 5 images)
    needs: [resolve, probe, backend, ui-web, ui-tools, ui-account, guard]
    # Skipped when probe found all five <sha> images (nothing to build).
    if: needs.probe.outputs.exists != 'true'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      REPO: ${{ needs.resolve.outputs.repo }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      # Bake reads this as a variable and passes it as the portal's Vite build arg.
      # A repo variable overrides the placeholder when the real origin is known.
      # The tools image takes no build args — it never links back to the portal.
      VITE_OFFLINE_TOOLS_URL: ${{ vars.VITE_OFFLINE_TOOLS_URL || 'https://tools.example.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # github.token (not secrets.GITHUB_TOKEN) so it also works when called by release.yml.
          password: ${{ github.token }}

      # Cache has no dedicated input in bake-action: it is passed as --set overrides.
      # ignore-error keeps a cache-export hiccup from failing an otherwise good build.
      - uses: docker/bake-action@v6
        with:
          files: ./docker-bake.hcl
          push: true
          set: |
            *.cache-from=type=gha,scope=shared
            *.cache-to=type=gha,mode=max,scope=shared,ignore-error=true

      - name: Summary (digests)
        run: |
          {
            echo "### images: \`${TAG}\`"
            echo "| service | ref | digest |"
            echo "|---|---|---|"
            for svc in account resource server bff tools; do
              ref="${REGISTRY}/${REPO}/${svc}:${TAG}"
              digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null || echo n/a)"
              echo "| ${svc} | \`${ref}\` | \`${digest}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

# Build: run the checks, then build and push the four application images to GHCR.
# Does not deploy.
#
# Image tags: <tag> (input, default latest) and <sha>. Roll back by deploying a
# previous sha with deploy.yml. Images are built by `docker buildx bake`
# (docker-bake.hcl) so the shared Gradle stage runs once instead of once per image.
# deploy/ is not an image: deploy.yml ships it over SSH from the same commit.
# Tests run in this workflow only — the Dockerfile builds with `-x test`.
#
# Everything is manual; auto triggers are commented out in `on:` below.

name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default latest; prefer v1.2.3 or a commit sha)'
        required: false
        default: 'latest'

  workflow_call:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        type: string
        default: ''
    outputs:
      tag:
        description: 'Resolved tag (empty input falls back to latest)'
        value: ${{ jobs.resolve.outputs.tag }}
      sha:
        description: 'Commit sha, pushed as a second tag (rollback target)'
        value: ${{ jobs.resolve.outputs.sha }}

  # ---------------- auto triggers (disabled, manual only for now) ----------------
  # push:
  #   branches: [main]
  # pull_request:          # checks only: the build job is skipped (see its `if`)

# Serialize builds of the same tag; never cancel one mid-push.
concurrency:
  group: build-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # resolve: normalize the tag and the lowercase repo name
  # ---------------------------------------------------------------------------
  resolve:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      repo: ${{ steps.resolve.outputs.repo }}
    steps:
      - id: resolve
        env:
          # The tag comes from a form input: read it via env, never inline it in the script.
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${RAW_TAG:-latest}"
          # It ends up in a docker tag, so whitelist the allowed characters.
          case "$tag" in
            ''|*[!A-Za-z0-9._-]*) echo "::error::invalid tag: $tag"; exit 1 ;;
          esac
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$tag"
            echo "sha=$GITHUB_SHA"
            echo "repo=$repo"
          } >> "$GITHUB_OUTPUT"
          echo "resolved: $repo/*:$tag (sha $GITHUB_SHA)"

  # ---------------------------------------------------------------------------
  # verify: cheap gates. All four run in parallel and must pass before the build.
  # ---------------------------------------------------------------------------
  backend:
    name: backend (java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # -PskipAdminUi / -PskipAuthUi: the SPAs are built in the Dockerfile's node
      # stages, not here (that is also why this stays fast).
      - name: Build + test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace build -PskipAdminUi -PskipAuthUi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/build/reports/tests/test
            **/build/test-results/test
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: '**/build/reports/jacoco/test/html'
          retention-days: 7

  ui-web:
    name: ui-web (vue3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nitrowater-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nitrowater-web/package-lock.json

      # `build` also type-checks (vue-tsc -b). It duplicates the web-ui Docker
      # stage on purpose: bundling errors surface here in seconds, not mid-build.
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  ui-account:
    name: ui-account (pnpm workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nitrowater-account
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.18.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: nitrowater-account/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

  guard:
    name: deploy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --no-interpolate: validate the files themselves; real values are checked
      # on the server by deploy/bin/check-env.sh during deploy.
      - name: Validate compose files
        run: |
          for f in deploy/docker/docker-compose.*.yml; do
            echo "::group::$f"
            docker compose -f "$f" config --no-interpolate -q
            echo "::endgroup::"
          done

      - name: Shell syntax (bash -n)
        run: |
          for f in deploy/bin/*.sh bin/dev/*.sh; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            bash -n "$f"
            echo "::endgroup::"
          done

      - name: PowerShell parse (no execution)
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Path bin/dev, bin -Filter *.ps1 -File -ErrorAction SilentlyContinue |
            ForEach-Object {
              $file = $_.FullName
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
              foreach ($e in $errors) {
                $bad += "${file}:$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          if ($bad.Count) { $bad | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'all .ps1 parsed clean'

  # ---------------------------------------------------------------------------
  # build: one bake invocation -> 4 images, Gradle runs once
  # ---------------------------------------------------------------------------
  build:
    name: bake (push 4 images)
    needs: [resolve, backend, ui-web, ui-account, guard]
    # Checks still run on pull_request, images are not built.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      REPO: ${{ needs.resolve.outputs.repo }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # github.token (not secrets.GITHUB_TOKEN) so it also works when called by release.yml.
          password: ${{ github.token }}

      # Cache has no dedicated input in bake-action: it is passed as --set overrides.
      # ignore-error keeps a cache-export hiccup from failing an otherwise good build.
      - uses: docker/bake-action@v6
        with:
          files: ./docker-bake.hcl
          push: true
          set: |
            *.cache-from=type=gha,scope=shared
            *.cache-to=type=gha,mode=max,scope=shared,ignore-error=true

      - name: Summary (digests)
        run: |
          {
            echo "### images: \`${TAG}\`"
            echo "| service | ref | digest |"
            echo "|---|---|---|"
            for svc in account resource server bff; do
              ref="${REGISTRY}/${REPO}/${svc}:${TAG}"
              digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null || echo n/a)"
              echo "| ${svc} | \`${ref}\` | \`${digest}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

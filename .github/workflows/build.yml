# ============================================================
# NitroWater Build —— 只构建 4 个镜像并推 GHCR，**不部署**。
#
# 触发（都是手动；自动触发见文件末尾注释）：
#   - workflow_dispatch：Actions → Build → Run workflow
#   - workflow_call   ：被 release.yml 复用（build + deploy 一条龙）
#
# 产物（4 svc × 2 tag）：
#   ghcr.io/<owner>/nitrowater/<svc>:<tag>
#   ghcr.io/<owner>/nitrowater/<svc>:<github.sha>
#
# 部署是另一件事：deploy.yml 只 pull 已构建好的镜像，不再 build。
# 因为镜像同时打了 sha 标签，**回滚 = 用上一个提交的 sha 当 tag 部署**。
#
# 与 ci.yml 的分工：ci.yml 判「能不能过」（含 target=bff 试构建 + 预热 gha 缓存），
# 本文件只负责产出可部署的镜像。
# ============================================================

name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（默认 latest；建议版本号 v1.2.3 或某个提交 sha）'
        required: false
        default: 'latest'

  workflow_call:
    inputs:
      tag:
        description: '镜像 tag'
        required: false
        type: string
        default: 'latest'
    outputs:
      tag:
        description: '实际构建的 tag（空输入时回落 latest）'
        value: ${{ jobs.resolve.outputs.tag }}
      sha:
        description: '本次构建的提交 sha（同时作为镜像标签，用于回滚定位）'
        value: ${{ jobs.resolve.outputs.sha }}

  # ---------------- 自动触发（暂不启用，需要时取消注释） ----------------
  # push:
  #   tags:
  #     - 'v*'

# 同一个 tag 的构建串行；不取消进行中的（推到一半被打断会留下半套镜像）。
concurrency:
  group: build-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ================================================================
  # resolve：归一化 tag / 小写仓库名，供矩阵与后续 workflow 复用
  # ================================================================
  resolve:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          # 输入来自 Run workflow 表单（人为可控），绝不直接拼进 shell 命令行。
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${RAW_TAG:-latest}"
          # tag 会进 docker tag；只放行合法字符，顺带挡住 shell 注入。
          case "$tag" in
            ''|*[!A-Za-z0-9._-]*)
              echo "::error::invalid tag: $tag（只允许 A-Za-z0-9._-）"
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "resolved: tag=$tag sha=$GITHUB_SHA"

  # ================================================================
  # build：四个 target 各出一个镜像（同一 Dockerfile，build 阶段由 gha 缓存共享）
  # 只写 cache-from 不写 cache-to：4 个 job 并行写同一 scope 会互相覆盖，
  # 缓存由 ci.yml 的 image job（mode=max）预热。
  # ================================================================
  build:
    name: build (${{ matrix.service }})
    needs: [resolve]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [account, resource, server, bff]
    steps:
      - uses: actions/checkout@v4

      # GHCR 要求镜像名全小写
      - name: Lowercase repo name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 不用 secrets.GITHUB_TOKEN：被 release.yml 复用（workflow_call）时同样可用。
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.service }}
          push: true
          cache-from: type=gha,scope=shared
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.service }}:${{ needs.resolve.outputs.tag }}
            ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.service }}:${{ needs.resolve.outputs.sha }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo '```'
            echo "ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.service }}:${{ needs.resolve.outputs.tag }}"
            echo "ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.service }}:${{ needs.resolve.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

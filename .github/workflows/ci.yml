# ============================================================
# NitroWater CI —— 只判断「能不能过」，不产出交付物
#
# 触发：**只手动**（Actions → CI → Run workflow，或 gh workflow run ci.yml）。
#       下面的自动触发先注释掉，需要时再取消。
#
# 五个 job（并行）：
#   backend     后端编译 + 单元测试 + JaCoCo（跳过两个 SPA：它们在 Dockerfile 的 node stage 里构建）
#   ui-web      nitrowater-web：npm ci → lint → build（build 里含 vue-tsc 类型检查）
#   ui-account  nitrowater-account（pnpm workspace）：install → lint → build（admin-ui + auth-ui）
#   guard       compose 结构校验 + deploy/bin、bin/dev 的 .sh/.ps1 语法
#   image       Dockerfile 试构建（target=bff，不推送）
#
# 镜像推送与上线在 deploy.yml；两者共用同一份 gha 构建缓存（scope=shared）。
#
# 说明：
#   - 后端 `build` 已含 test：两个 @SpringBootTest 是 @Disabled 的，CI 不需要 MySQL/Redis。
#   - 不在 CI 跑 deploy/bin/check-env.sh：它查的是宿主机端口与真实密钥，属于上线门禁（deploy.yml）。
# ============================================================

name: CI

on:
  workflow_dispatch:

  # ---------------- 自动触发（暂不启用：全部改手动，需要时取消注释） ----------------
  # pull_request:
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - '.ai/**'
  #     - 'docs/**'
  #     - 'README.md'
  #     - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # 后端：编译 + 单元测试
  # ================================================================
  backend:
    name: backend (java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # -PskipAdminUi/-PskipAuthUi：不在这里跑 node/pnpm（Dockerfile 的 node stage 负责）
      - name: Build + test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace build -PskipAdminUi -PskipAuthUi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/build/reports/tests/test
            **/build/test-results/test
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: '**/build/reports/jacoco/test/html'
          retention-days: 7

  # ================================================================
  # 门户 SPA（nitrowater-web，npm）
  # ================================================================
  ui-web:
    name: ui-web (vue3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nitrowater-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nitrowater-web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  # ================================================================
  # 账号端 SPA（nitrowater-account，pnpm workspace：admin-ui + auth-ui + packages/*）
  # ================================================================
  ui-account:
    name: ui-account (pnpm workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nitrowater-account
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.18.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: nitrowater-account/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

  # ================================================================
  # 部署面守卫：compose 结构 + 脚本语法
  # 不用真实 .env（--no-interpolate）：只校验「文件本身」成立，
  # 变量齐不齐由 deploy.yml 里的 check-env.sh 在服务器上把关。
  # ================================================================
  guard:
    name: deploy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          for f in deploy/docker/docker-compose.*.yml; do
            echo "::group::$f"
            docker compose -f "$f" config --no-interpolate -q
            echo "::endgroup::"
          done

      - name: Shell syntax (bash -n)
        run: |
          for f in deploy/bin/*.sh bin/dev/*.sh; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            bash -n "$f"
            echo "::endgroup::"
          done

      - name: PowerShell parse (no execution)
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Path deploy/bin, bin/dev, bin -Filter *.ps1 -File -ErrorAction SilentlyContinue |
            ForEach-Object {
              $file = $_.FullName
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
              foreach ($e in $errors) {
                $bad += "${file}:$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          if ($bad.Count) { $bad | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'all .ps1 parsed clean'

  # ================================================================
  # Dockerfile 试构建（不推送）：确认交付链路仍成立。
  # 只构建 bff：它是最重的一条（三个 node stage 之一 web + 全量 gradle 阶段 + 额外的 curl 层），
  # 其余三个 target 只是「COPY 自己的 app.jar」，同一份 build 阶段已在这里验过。
  # 同时给 deploy.yml 预热 gha 缓存；嫌慢可以先手动跳过这个 job。
  # ================================================================
  image:
    name: image (dockerfile target=bff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: bff
          push: false
          cache-from: type=gha,scope=shared
          cache-to: type=gha,mode=max,scope=shared

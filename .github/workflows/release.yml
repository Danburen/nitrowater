# ============================================================
# NitroWater Release —— build + deploy 一条流水线（两件事一次做完）
#
# 手工触发一次，同一个 tag 同时用于「构建」与「部署」：
#   job build  → 复用 build.yml  （4 镜像推 GHCR，产物带 <tag> + <sha>）
#   job deploy → 复用 deploy.yml （preflight 校验镜像存在 → SSH pull + up -d）
#
# 与另外两个工作流的差别：
#   build.yml   只构建，不碰服务器（可以先攒着镜像，择时上线）
#   deploy.yml  只部署已有镜像（回滚、补发、只换 compose 都用它）
#   release.yml 构建成功才部署（needs 链），失败不会去动线上
#
# 回滚：不要用本文件（它会重新构建）。用 Actions → Deploy → tag=上一个提交的 sha。
# ============================================================

name: Release (build + deploy)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（默认 latest；建议版本号 v1.2.3）'
        required: false
        default: 'latest'

# 一条发布跑到底；构建期间不取消（推到一半会留下半套镜像）。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ inputs.tag }}
    # 被调用的 workflow 只能收窄权限，所以这里必须给出它需要的写权限。
    permissions:
      contents: read
      packages: write

  deploy:
    name: deploy
    needs: [build]
    uses: ./.github/workflows/deploy.yml
    with:
      # 用 build 归一化后的 tag（空输入已回落 latest），避免两处各写一份默认值。
      tag: ${{ needs.build.outputs.tag }}
      skip_preflight: false
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      GHCR_USER: ${{ secrets.GHCR_USER }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    permissions:
      contents: read
      packages: read

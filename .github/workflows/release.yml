# Release: build + deploy in one run, both pinned to the same commit sha.
#
#   build  -> build.yml   (probe, checks, then 4 images to GHCR)
#   deploy -> deploy.yml  (preflight, then pull + backup + up -d on the host)
#   deploy.yml also enforces restart=unless-stopped, so a host reboot brings the stack back.
#
# The deploy uses build's `sha` output, not the `tag` input: sha tags are what the
# commit actually produced, while `tag` is a moving name (latest / v1.2.3) that a later
# build can repoint. When the probe finds all four images already pushed for this sha,
# build.yml skips checks + bake, the called workflow still reports success, and this
# run becomes "deploy the existing images" — the intended no-op fast path.
#
# needs: deploy only runs if build succeeded, so a red commit never reaches the host.
# Rollback: use Deploy with `ref` = the commit that produced the images (leave `tag`
# empty so it resolves to that commit's sha); Release would rebuild instead of restoring.

name: Release (build + deploy)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag for a human-readable alias (default latest; deployment uses the sha)'
        required: false
        default: 'latest'

# Do not use the same group as deploy.yml: the callee would wait on the caller.
concurrency:
  group: release
  cancel-in-progress: false

# Every job below narrows or widens this explicitly; the default token stays read-only.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ inputs.tag }}
    # A called workflow can only narrow permissions, so grant what it needs here.
    permissions:
      contents: read
      packages: write

  deploy:
    needs: [build]
    uses: ./.github/workflows/deploy.yml
    with:
      # Immutable ref of what was just built (or already existed) for this commit.
      tag: ${{ needs.build.outputs.sha }}
      skip_preflight: false
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
      GHCR_USER: ${{ secrets.GHCR_USER }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    permissions:
      contents: read
      packages: read

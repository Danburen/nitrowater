# Release: build + deploy in one run. Both steps use the same tag.
#
#   build  -> build.yml   (checks, then 4 images to GHCR)
#   deploy -> deploy.yml  (preflight, then pull + up -d on the server)
#
# needs: deploy only runs if build succeeded, so a red commit never reaches the host.
# Rollback: use Deploy with a previous sha (`ref` = the commit that produced it) — Release
# would rebuild the tag from the current branch instead of restoring the old artifacts.

name: Release (build + deploy)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default latest; prefer v1.2.3)'
        required: false
        default: 'latest'

# Do not use the same group as deploy.yml: the callee would wait on the caller.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ inputs.tag }}
    # A called workflow can only narrow permissions, so grant what it needs here.
    permissions:
      contents: read
      packages: write

  deploy:
    needs: [build]
    uses: ./.github/workflows/deploy.yml
    with:
      # Build's normalized tag (empty input already fell back to latest).
      tag: ${{ needs.build.outputs.tag }}
      skip_preflight: false
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      GHCR_USER: ${{ secrets.GHCR_USER }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    permissions:
      contents: read
      packages: read

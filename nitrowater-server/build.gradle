plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.nitrowater'
version = '0.0.1-SNAPSHOT'
description = 'nitrowater-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':nitrowater-core')
    // --- nitrowater-lib: 直依赖以便复用共享工具（如 IdentifierGenerator/Romanizer；core 的 implementation 不传递）---
    implementation project(':nitrowater-lib')
    // --- 拼音：离线中文→拉丁音译（slug 生成；替代重量级 ICU，见 .ai/context）---
    implementation 'com.belerweb:pinyin4j:2.5.1'
    // --- web + security（OAuth2 Resource Server：校验 SSO 签发的 JWT）---
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // --- 业务库（与 SSO 库隔离；core 的依赖 implementation 不传递，故按 Option B 在此重声明）---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // --- Flyway：迁移业务库 nitrowater_biz ---
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    // --- Redis：代码运行器的匿名限流（per-IP 滑动窗口 + 全局并发闸）---
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- Spring AI (RAG over the VeloChatX docs) ---
    // Chat/embedding speak the OpenAI-compatible protocol, so any vendor (DeepSeek, DashScope,
    // SiliconFlow, OpenAI, ...) works by pointing the base URL at it. Qdrant is the third-party
    // vector index; the Markdown reader and token splitter also come from Spring AI.
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.2')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-qdrant'
    implementation 'org.springframework.ai:spring-ai-markdown-document-reader'
    // --- Web search result extraction: strip HTML down to readable text before it reaches the
    // agent. Small, no transitive surprises. ---
    implementation 'org.jsoup:jsoup:1.18.3'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Same working directory as the jar launchers (repo root) so the relative AI docs dir
// (deploy/plugin-docs/...) resolves consistently under bootRun and `java -jar`.
tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}

// 固定 bootJar 名称，便于根多目标 Dockerfile 提取。
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

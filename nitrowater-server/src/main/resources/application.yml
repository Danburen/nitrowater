# ============================================================
# nitrowater-server（业务 API + OAuth2 Resource Server）
# 业务库与 SSO 库【隔离】：两者仅通过 uid 做逻辑关联，不建跨库 FK。
# ============================================================

server:
  port: 8081

spring:
  application:
    name: nitrowater-server

  # -------- 业务库（独立于 SSO 库 nitrowater；首次连接自动建库）--------
  datasource:
    url: jdbc:mysql://localhost:3306/nitrowater_biz?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:123456}"   # 生产用 DB_PASSWORD 覆盖
    driver-class-name: com.mysql.cj.jdbc.Driver

  # -------- JPA（业务表结构由迁移管理，不自动改结构）--------
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  # -------- Redis：仅用于代码运行器限流（不是会话存储）--------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      username: default
      password: "${REDIS_PASSWORD:}"
      # Redis is used as a plain key-value store (rate limiting), not through the repository
      # abstraction. Without this, Spring Data Redis scans every JPA repository and logs
      # "Could not safely identify store assignment for repository candidate ...".
      repositories:
        enabled: false

  # -------- 业务表迁移（业务库 nitrowater_biz；V1 baseline）--------
  flyway:
    enabled: true

  # -------- Spring AI: documentation assistant (RAG) --------
  # Chat and embeddings speak the OpenAI-compatible protocol but are allowed to use different
  # vendors (Spring AI composes request URLs as base-url + /chat/completions or /embeddings).
  #   chat      -> DeepSeek (https://api.deepseek.com); deepseek-reasoner has no tool calling, so
  #                the agent stays on deepseek-chat.
  #   embedding -> SiliconFlow (https://api.siliconflow.cn/v1), Qwen3-Embedding-0.6B (1024 dims).
  #                DeepSeek exposes no embeddings endpoint. Changing the embedding model or its
  #                dimensions invalidates every vector already stored in Qdrant (full re-index
  #                required).
  # Keys: AI_CHAT_API_KEY / DEEPSEEK_API_KEY for chat and web search,
  #       SILICONFLOW_API_KEY / AI_EMBEDDING_API_KEY for embeddings.
  ai:
    # The OpenAI starter also auto-configures image/audio/moderation models. They are unused here
    # and require credentials of their own, so switch them off (the chat/embedding models are
    # selected by their own properties below).
    model:
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # Chat and embedding resolve their own keys below; no shared fallback is needed here.
      chat:
        api-key: ${AI_CHAT_API_KEY:${DEEPSEEK_API_KEY:not-configured}}
        base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
        model: ${AI_CHAT_MODEL:deepseek-chat}
        temperature: ${AI_CHAT_TEMPERATURE:0.2}
        # Answer budget per turn. 1200 cut most technical answers mid-sentence (~900 CJK chars);
        # 4096 is the safe default for deepseek-chat, which supports more when the deployment does.
        max-tokens: ${AI_CHAT_MAX_TOKENS:4096}
        # DeepSeek supports stream_options.include_usage; the usage rides on the last content chunk.
        stream-usage: true
        timeout: 90s
        max-retries: 2
      embedding:
        api-key: ${AI_EMBEDDING_API_KEY:${SILICONFLOW_API_KEY:not-configured}}
        base-url: ${AI_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
        model: ${AI_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
        # Qwen3-Embedding-0.6B returns 1024 dimensions. Keep the explicit size so a vendor-side
        # default change cannot silently break the existing Qdrant collection. Switching the
        # model or dimension requires a full re-index (POST /api/admin/ai/reindex).
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
        timeout: 30s
        max-retries: 2
    # Agent tool-loop guardrails (Spring AI's built-in tool-calling limits). Exceeding a limit
    # returns an error response to the model instead of throwing.
    #
    # The framework cap counts *every* invocation, including duplicates and failures, while the
    # tool's own budget (app.ai.web-search.max-successes) counts only successes. Keep the cap
    # above the success budget: webSearch 12 = 8 successes + 4 attempts available for duplicate
    # queries or failed searches. `calculate` gets headroom for multi-step arithmetic; it is pure
    # CPU and its rows are COMPACT, so extra calls cost no tokens.
    tools:
      limits:
        # runCode gets one call beyond its 3-run budget: that 4th call is how the tool itself
        # returns `retry_exhausted` instead of the framework rejecting it first.
        max-total-tool-calls: ${AI_AGENT_MAX_TOOL_CALLS:18}
        max-calls-per-tool-default: ${AI_AGENT_MAX_CALLS_PER_TOOL:3}
        max-calls-per-tool:
          runCode: 4
          webSearch: 12
          calculate: 6
        on-limit-exceeded: RETURN_ERROR_RESPONSE
    # Qdrant is the third-party vector index. initialize-schema=false keeps the service bootable
    # when Qdrant is down; DocsIndexService creates the collection on the first index run.
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: ${AI_COLLECTION:nitrowater_velochatx_docs}
        initialize-schema: false

  # -------- OAuth2 Resource Server：校验 SSO(AS) 签发的 JWT（JWKS 验签）--------
  # issuer 必须等于 AS 的 issuer（= nitrowater-account 的 jwt.issuer）。生产设 JWT_ISSUER=https://auth.nitrowater.cn。
  # 显式给出 jwk-set-uri：避免启动时强制 OIDC discovery（AS 未起也能启动，首个请求时才拉 JWKS）。
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8090}
          jwk-set-uri: ${JWT_ISSUER:http://localhost:8090}/oauth2/jwks
  config:
    import:
      - optional:file:./bin/dev/common.yml
      - optional:file:./bin/dev/common-dev-secrets.yml
# -------- 本服务的额外 JWT 校验（Spring 默认不校验 aud，这里显式收紧）--------
# audiences：允许消费的 aud 列表，逗号分隔。必须与 AS 的
# app.oidc.access-token-audiences 对齐（AS 会额外保留 client_id）。
app:
  security:
    jwt:
      audiences: nitrowater-server
    # 浏览器跨域白名单（Bearer-only，不带 Cookie）。生产用 CORS_ALLOWED_ORIGIN_PATTERNS 覆盖。
    cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://nitrowater.cn,https://*.nitrowater.cn}
  # -------- Documentation assistant: corpus, retrieval and quotas --------
  # The indexer is idempotent: a full re-index deletes the corpus and re-embeds it; deterministic
  # ids keep point ids stable.
  ai:
    enabled: ${AI_ENABLED:true}
    chunk-size: ${AI_CHUNK_SIZE:500}
    min-chunk-size-chars: ${AI_MIN_CHUNK_SIZE_CHARS:100}
    max-chunks-per-doc: ${AI_MAX_CHUNKS_PER_DOC:40}
    top-k: ${AI_TOP_K:6}
    similarity-threshold: ${AI_SIMILARITY_THRESHOLD:0.35}
    max-question-chars: ${AI_MAX_QUESTION_CHARS:2000}
    max-history-turns: ${AI_MAX_HISTORY_TURNS:4}
    ingest-on-startup: ${AI_INGEST_ON_STARTUP:true}
    per-user-per-minute: ${AI_PER_USER_PER_MINUTE:20}
    # ---- Context window & rolling compaction ----
    # Everything here is a share of the model's real context window, the way agent frameworks size
    # their prompts: the window is a property of the model (deepseek-chat is served by
    # deepseek-flash — 1M context, verified against GET /models and a live request), and the replay
    # budget / compaction trigger derive from it. Switching models is a one-line change
    # (model-window-tokens), not a hunt for hard-coded budgets.
    #
    # The replay budget is pinned to 64K on purpose, even though the window is 1M: every model round
    # resends the whole budget, so it is a cost lever, not a capability limit. 64K keeps a tool turn
    # at tens of thousands of tokens and still leaves ~900K of headroom for tool results and the
    # 4096-token completion.
    # history-window-ratio is the derived alternative (1M x 0.064 = 64K); it only applies when
    # history-max-tokens is absent. Setting the absolute budget to 0 restores the legacy
    # max-history-turns mode.
    # history-hard-max-messages bounds how many rows one turn reads (a query bound, not a budget:
    # it only starts to matter for chats made of many tiny messages).
    #
    # Compaction folds the oldest unsummarized turns into ai_conversation.summary and runs after a
    # turn, never on the request path. Two triggers, whichever fires first:
    #   * compact-trigger-ratio — the backlog's estimated size as a share of the replay budget
    #     (0.8 x 64K = 51.2K tokens). It sits *below* 1.0 by design: folding before the window starts
    #     dropping turns is what keeps the summary contiguous with what the model can still see.
    #   * compact-trigger-messages — guard for chats made of many tiny turns.
    # A smaller trigger means fresher summaries and more summarizer calls; /compact folds on demand.
    # summary-input-max-chars bounds one summarizer call, so a large backlog needs several passes
    # (at most 4 per run); summary-max-chars is what the summary keeps.
    context:
      model-window-tokens: ${AI_CONTEXT_MODEL_WINDOW_TOKENS:1000000}
      history-window-ratio: ${AI_CONTEXT_HISTORY_WINDOW_RATIO:0.064}
      history-max-tokens: ${AI_CONTEXT_HISTORY_MAX_TOKENS:64000}
      history-hard-max-messages: ${AI_CONTEXT_HARD_MAX_MESSAGES:120}
      compact-enabled: ${AI_CONTEXT_COMPACT_ENABLED:true}
      compact-trigger-messages: ${AI_CONTEXT_COMPACT_TRIGGER_MESSAGES:32}
      compact-trigger-ratio: ${AI_CONTEXT_COMPACT_TRIGGER_RATIO:0.8}
      compact-keep-turns: ${AI_CONTEXT_COMPACT_KEEP_TURNS:2}
      summary-max-chars: ${AI_CONTEXT_SUMMARY_MAX_CHARS:2000}
      summary-input-max-chars: ${AI_CONTEXT_SUMMARY_INPUT_MAX_CHARS:24000}
    # Long-term memory lifecycle: unused active entries expire after retention-days; user-deleted
    # and expired rows are hard-deleted after purge-days so audit history stays bounded.
    memory:
      retention-days: ${AI_MEMORY_RETENTION_DAYS:180}
      purge-days: ${AI_MEMORY_PURGE_DAYS:30}
      cleanup-cron: ${AI_MEMORY_CLEANUP_CRON:0 15 3 * * *}
    # Usage counters: per-user day rows are pruned after retention-days; the uid=0 platform row is
    # kept much longer because it is the only long-term "site spend" series.
    usage:
      retention-days: ${AI_USAGE_RETENTION_DAYS:31}
      global-retention-days: ${AI_USAGE_GLOBAL_RETENTION_DAYS:366}
      cleanup-cron: "${AI_USAGE_CLEANUP_CRON:0 45 4 * * *}"
    # Documentation corpora. Each entry is a logical corpus; location may be a filesystem path or
    # a classpath: prefix. `public-base-url` empty means markdown-only (citations carry no URL).
    collections:
      - corpus: velochatx
        description: VeloChatX 插件文档（安装、命令与权限、占位符、配置、排障）
        location: classpath:ai/docs/velochatx
        # Published by bin/dev/sync-docs.ps1 into deploy/plugin-docs (mounted by the docs nginx).
        public-base-url: /plugin/velochatx/docs/
      - corpus: nitrowater
        description: NitroWater 平台自身文档（架构、SSO/BFF、资源服务、API、部署与运维）
        location: classpath:ai/docs/nitrowater
        # Markdown-only corpus: no published site, so citations carry no URL.
        public-base-url: ''
    # ---- Agent: skills + tools ----
    # When true, a client disconnect cancels the model stream immediately. The default (false)
    # lets the turn finish server-side so the full answer is persisted even if the browser leaves;
    # no further SSE frames are written after the disconnect either way.
    agent:
      interrupt-on-disconnect: ${AI_AGENT_INTERRUPT_ON_DISCONNECT:false}
      # Model rounds per turn (one round = one model call; a round may run several tool calls).
      # Separate from spring.ai.tools.limits.max-total-tool-calls on purpose: that counter is owned
      # by Spring AI and counts invocations including failures, so tuning a tool budget (e.g. the 12
      # webSearch attempts) must not silently move the round cap.
      max-rounds: ${AI_AGENT_MAX_ROUNDS:18}
      # Wall-clock budget of one turn (model rounds + tool calls together). It must stay below the
      # SSE timeout (180s in AiAgentController); when it expires the turn ends with an error instead
      # of hanging. Per-tool deadlines are separate and much smaller: a tool that misses its own
      # deadline answers with a retryable `tool.timeout` and the model decides whether to retry.
      turn-timeout-ms: ${AI_AGENT_TURN_TIMEOUT_MS:150000}
      # Retries of a round that failed before the first token reached the client (a 503/429 or a
      # reset connection). Once a delta is out the stream cannot be replayed, so the retry stops
      # there — and a turn timeout is never retried, because the budget is already gone.
      # 0 disables it.
      retry-attempts: ${AI_AGENT_RETRY_ATTEMPTS:1}
      retry-backoff-ms: ${AI_AGENT_RETRY_BACKOFF_MS:400}
      # Daily-budget floor for tools. Before starting a tool batch the agent asks the usage session
      # how much of the user's day is left; below this it stops calling tools and drives one final
      # round with a wrap-up instruction instead ("answer from what you have, say what is unverified").
      # Sized for one last answer: system prompt + history (~4-6k) plus a normal completion. 0 disables
      # the guard (only the admission check in AiUsageService remains).
      quota-floor-tokens: ${AI_AGENT_QUOTA_FLOOR_TOKENS:10000}
      # Zone of the per-turn <now> block in the user message. The clock is inlined because a model
      # cannot know today's date; keeping it in the user message (not the system prompt) preserves
      # the provider's prefix cache across turns.
      time-zone: ${AI_AGENT_TIME_ZONE:Asia/Shanghai}
    # ---- Content moderation (violation words) ----
    # The active posture lives in the database (ai_admin_setting.moderation_mode, editable from
    # 管理端 › AI › 运行设置) so it can be switched without a redeploy. It defaults to LOG (record
    # only): run in shadow mode first, review the hits, tune the dictionary, then switch to ENFORCE.
    # The committed word list is a small safety baseline. Mount a fuller list at deploy time and
    # point AI_MODERATION_DICT at it rather than committing one to this public repository.
    moderation:
      dict-locations: ${AI_MODERATION_DICT:classpath:ai/moderation/words.txt}
      allow-locations: ${AI_MODERATION_ALLOW:classpath:ai/moderation/allow.txt}
      # Blocked questions per user within the window before that user's AI endpoints are paused.
      strike-limit: ${AI_MODERATION_STRIKE_LIMIT:5}
      strike-window-minutes: ${AI_MODERATION_STRIKE_WINDOW_MINUTES:10}
      cooldown-minutes: ${AI_MODERATION_COOLDOWN_MINUTES:15}
      # Audit rows are kept this long, then purged by the nightly cleanup (cleanup-cron below).
      retention-days: ${AI_MODERATION_RETENTION_DAYS:90}
      cleanup-cron: "${AI_MODERATION_CLEANUP_CRON:0 30 4 * * *}"
    # Web search is DeepSeek's search API. The tool is only advertised when a key is present and
    # the user opted in for the turn (`AiStatusResp.webSearchEnabled` reflects the real state).
    web-search:
      enabled: ${AI_WEB_SEARCH_ENABLED:true}
      # Chat, embeddings and search each use their own vendor key.
      api-key: ${AI_WEB_SEARCH_API_KEY:${DEEPSEEK_API_KEY:}}
      endpoint: ${AI_WEB_SEARCH_ENDPOINT:https://api.deepseek.com/v1/tools/search}
      # `searchDocs` falls back to one web search per turn when the local corpus has no match.
      auto-fallback: ${AI_WEB_SEARCH_AUTO_FALLBACK:true}
      # Hits per call. The explicit tool and the docs fallback share this value; tokens grow
      # linearly, so breadth comes from more queries (max-successes) rather than more hits here.
      max-results: ${AI_WEB_SEARCH_MAX_RESULTS:3}
      # Successful searches per turn, counting the fallback. Failures and retries do not count.
      # Eight covers a multi-part research question (one or two queries per sub-question); every
      # call resends the accumulated results, so this is also the main lever on token cost — keep
      # the framework's per-tool cap above it and raise the daily token limit accordingly.
      max-successes: ${AI_WEB_SEARCH_MAX_SUCCESSES:8}
      # HTTP attempts per call (first try + one retry) and the pause between retryable attempts.
      max-attempts: ${AI_WEB_SEARCH_MAX_ATTEMPTS:2}
      retry-backoff-ms: ${AI_WEB_SEARCH_RETRY_BACKOFF_MS:300}
      timeout-ms: ${AI_WEB_SEARCH_TIMEOUT_MS:20000}
  # -------- 代码沙箱（Piston）--------
  # 业务服务直连 Piston（不设独立模块）；仅登录用户可用（匿名只跑浏览器本地 WASM）。
  # 执行采用「单用户串行 + 全局并发 + 有界排队」：超过队列上限或等待超时才返回 429。
  sandbox:
    base-url: ${PISTON_BASE_URL:http://localhost:2000}
    connect-timeout-ms: 2000
    read-timeout-ms: 40000          # 必须 > compile+run（20000+10000），留 10s 余量
    max-code-bytes: 65536
    global-concurrency: 2           # 同时最多 2 个在途执行（保护 Piston）
    compile-timeout-ms: 20000
    per-user-per-minute: 10         # 每个登录用户每分钟最多 10 次
    per-user-per-day: 200           # 每个登录用户每天最多 200 次
    max-queue: 20                   # 全局最多排队 20 个请求
    queue-wait-ms: 15000            # 单次请求最长排队等待 15s
    # Agent runCode: ask before blocking when the queue is long; otherwise wait up to this budget.
    agent-queue-wait-ms: 15000
    agent-queue-ask-waiting: 3
    agent-queue-ask-ms: 5000
    agent-queue-estimate-run-ms: 3000
    run-timeout-ms: 10000
    max-output-bytes: 65536         # stdout/stderr 各自最多回传 64KB
    # MUST be <= the Piston container's PISTON_RUN_MEMORY_LIMIT, else Piston rejects the
    # request with 400 ("run_memory_limit cannot exceed the configured limit of ...").
    memory-limit-bytes: 268435456   # 256MB（单位 bytes）


logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.springframework.orm.jpa: WARN
    org.hibernate: WARN

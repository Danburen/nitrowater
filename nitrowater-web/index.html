<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Mobile browser chrome follows the theme (values mirror style.css tokens). -->
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="NitroWater —— 为 Minecraft 腐竹提供一站式开服工具：MOTD 格式化预览、server.properties 生成/校验、server-icon 生成、启动脚本生成，另有插件中心、在线代码运行与通用开发工具。"
    />
    <meta name="keywords" content="NitroWater,Minecraft,我的世界,腐竹,开服工具,MOTD,server.properties,server-icon,启动脚本,插件中心,在线工具箱" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NitroWater" />
    <meta property="og:title" content="NitroWater · Minecraft 腐竹的一站式工具箱" />
    <meta property="og:description" content="MOTD、server.properties、server-icon、启动脚本，一站式开服工具；插件中心与通用功能并存。" />
    <meta property="og:url" content="https://nitrowater.cn/" />
    <meta name="twitter:card" content="summary" />
    <title>NitroWater · Minecraft 腐竹的一站式工具箱</title>
    <!-- Set the theme before first paint to avoid a flash of the wrong theme (FOUC).
         Mirrors src/shared/theme/useTheme.ts: persisted choice, else the OS preference. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nitrowater-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

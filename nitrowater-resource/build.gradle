plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.nitrowater'
version = '0.0.1-SNAPSHOT'
description = 'nitrowater-resource'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Shared JSON envelope (ApiResponse/PageDto) and the response advice.
    implementation project(':nitrowater-lib')
    // Shared Spring MVC/Security JSON plumbing (ApiResponseAdvice / GlobalExceptionHandler) now
    // lives in core; core's own data stack is compileOnly so nothing extra is pulled in here.
    implementation project(':nitrowater-core')
    // --- web + security（OAuth2 Resource Server：校验 SSO 签发的 JWT）---
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // --- AOP：@RateLimit 切面（core 的 RateLimitAspect 需要 aspectjweaver 才会织入；
    //     与 account / core 保持同一组依赖，不引 Boot 4 里已不在 BOM 的 starter）---
    implementation 'org.springframework:spring-aop'
    implementation 'org.aspectj:aspectjweaver:1.9.25.1'
    // --- 资源元数据库（独立库 nitrowater_resource；Flyway 管理）---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // --- 读缓存：presigned GET URL 缓存（Redis），对齐 waterfun 读取缓存范式 ---
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // --- 腾讯 COS 对象存储客户端（可选后端；仅当 app.resource.cos.secret-id 配置时装配）---
    implementation 'com.qcloud:cos_api:5.6.247'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 与其它模块一致：workingDir = 仓库根，便于解析相对路径（如本地存储目录）。
//  - 注入 RESOURCE_INTERNAL_TOKEN（/internal/** 内部发布端点的共享密钥；生产用环境变量覆盖）
tasks.named('bootRun') {
    workingDir = rootProject.projectDir
    environment 'RESOURCE_INTERNAL_TOKEN', System.getenv('RESOURCE_INTERNAL_TOKEN') ?: 'nitrowater-internal-dev'
}

// 固定 bootJar 名称，便于 Dockerfile 复制（docker compose build 前先跑 bootJar）。
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

# ============================================================
# nitrowater-resource（统一资源管理服务 · 基础设施）
# 独立库 nitrowater_resource；OAuth2 RS 校验 SSO 的 JWT；
# 存储后端可插拔（S3 兼容 = 自托管 SeaweedFS；LOCAL 文件系统）。
# 既有对象存储与本地托管统一走本服务。
# ============================================================

server:
  port: 8093

spring:
  application:
    name: nitrowater-resource

  # -------- 资源元数据库（独立于 account/biz）--------
  datasource:
    url: jdbc:mysql://localhost:3306/nitrowater_resource?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: "${DB_PASSWORD:123456}"   # 生产用 DB_PASSWORD 覆盖
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  # -------- Redis（presigned 读 URL 缓存；waterfun 同款读缓存范式）--------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  # -------- 迁移（限业务自定义库）--------
  flyway:
    enabled: true

  # -------- OAuth2 Resource Server：校验 SSO(AS) 的 JWT --------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8090}
          jwk-set-uri: ${JWT_ISSUER:http://localhost:8090}/oauth2/jwks

# -------- JWT 校验（audience 收紧；Spring 默认不校验 aud）--------
# 注意：AS 的 app.oidc.access-token-audiences 需与本值对齐（或 BFF 按资源受众换 token）。
app:
  security:
    jwt:
      audiences: ${RESOURCE_JWT_AUDIENCES:nitrowater-resource,nitrowater-server}
  resource:
    default-backend: ${RESOURCE_BACKEND:s3}        # s3 | cos | local
    presign-expiry-seconds: ${RESOURCE_PRESIGN_EXPIRY:600}
    max-size-bytes: ${RESOURCE_MAX_SIZE:10485760}  # 10MB (end-user uploads)
    # Admin-published plugin artifacts (.jar only). Kept separate so raising the plugin cap does not
    # also raise the end-user upload cap.
    plugin-max-size-bytes: ${RESOURCE_PLUGIN_MAX_SIZE:67108864}  # 64MB
    # Abandoned PENDING uploads (client never confirmed) are reaped after this grace period.
    # <= 0 disables the cleanup job. The job removes bytes first, then flips the row to ORPHAN.
    orphan-pending-minutes: ${RESOURCE_ORPHAN_PENDING_MINUTES:60}
    orphan-cleanup-interval-ms: ${RESOURCE_ORPHAN_CLEANUP_INTERVAL_MS:3600000}
    orphan-cleanup-initial-delay-ms: ${RESOURCE_ORPHAN_CLEANUP_INITIAL_DELAY_MS:60000}
    read-cache-safety-margin-seconds: ${RESOURCE_CACHE_MARGIN:60}  # 缓存 TTL = 签名有效期 - 该余量
    # S3 兼容后端：默认自托管 SeaweedFS 的 S3 网关（:8333）
    # 反向代理时设 SeaweedFS 的 -s3.externalUrl，使 presigned URL 使用对外域名
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:8333}          # 服务端访问；容器内填 http://seaweedfs:8333
      access-key: ${S3_ACCESS_KEY:nitrowater}
      secret-key: ${S3_SECRET_KEY}
      bucket: ${S3_BUCKET:nitrowater}
      region: ${S3_REGION:us-east-1}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:}                 # presigned URL 用（浏览器可达）；空=同 endpoint
    # 腾讯 COS 后端（可选：配了 secret-id 才装配；不配置不影响 s3/local）
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      region: ${COS_REGION:ap-shanghai}
      bucket: ${COS_BUCKET:}
    local:
      base-path: ${RESOURCE_LOCAL_PATH:./deploy/resource-storage}
    # 内部发布端点（/internal/**）共享密钥；留空则端点禁用。仅运维脚本直连服务端口使用。
    internal:
      token: ${RESOURCE_INTERNAL_TOKEN:}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

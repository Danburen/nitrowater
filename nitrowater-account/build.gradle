plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.nitrowater'
version = '0.0.1-SNAPSHOT'
description = 'nitrowater-account'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":nitrowater-lib")
    implementation project(':nitrowater-core')
    implementation project(':nitrowater-core-web')
    // --- web ---
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.41'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation('com.aliyun:dysmsapi20170525:4.1.1') {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }
    implementation 'org.springframework:spring-aop'
    implementation 'org.aspectj:aspectjweaver:1.9.25.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'

    implementation 'cn.hutool:hutool-captcha:5.8.26'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'org.jetbrains:annotations:26.0.2'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    implementation 'tools.jackson.core:jackson-databind'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Phase 1 本地运行：
//  - workingDir = 仓库根，使 application.yml 的 file:./deploy/keys/* 能解析
//  - 注入 NITROWATER_KEK（EncryptionHelper 读取的 32 字节 AES KEK，Base64）
tasks.named('bootRun') {
    workingDir = rootProject.projectDir
    environment 'NITROWATER_KEK', System.getenv('NITROWATER_KEK') ?: 'kElE+g/NUUkCAG0azg9ZcYYXbevGg9mYuUtJvICut98='
    environment 'BFF_CLIENT_SECRET', System.getenv('BFF_CLIENT_SECRET') ?: 'nitrowater-bff-secret'
}

// 固定 bootJar 名称，便于根多目标 Dockerfile 提取（各服务同名 app.jar）。
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

// ============================================================
// Account UIs (Vue 3 SPAs) — pnpm workspace at this module root.
//  - one `pnpm install` covers admin-ui, auth-ui and packages/* (shared libs);
//  - `./gradlew build` rebuilds both SPAs into src/main/resources/static/{admin,auth}
//    (gitignored, generated) and processResources packs them into the jar;
//  - -PskipAdminUi / -PskipAuthUi: skip either SPA (CI/Docker build them in node stages).
// Requires pnpm on PATH; Docker performs the install/build itself and passes both skip flags.
// ============================================================
def uiRoot = project.projectDir
def skipAdminUi = project.hasProperty('skipAdminUi')
def skipAuthUi = project.hasProperty('skipAuthUi')
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

// Windows resolves the pnpm shim through cmd /c; Linux/macOS can exec pnpm directly.
def pnpmCommand = { List<String> args ->
    (isWindows ? ['cmd', '/c', 'pnpm'] : ['pnpm']) + args
}

tasks.register('pnpmInstall', Exec) {
    group = 'build'
    description = 'Install the account UI workspace dependencies with pnpm.'
    workingDir = uiRoot
    commandLine pnpmCommand(['install'])
    inputs.files(
        file('package.json'),
        file('pnpm-workspace.yaml'),
        file('pnpm-lock.yaml'),
        fileTree(uiRoot) {
            include '*/package.json', 'packages/*/package.json'
            exclude 'node_modules/**', 'build/**'
        },
    )
    outputs.dir(file('node_modules'))
    onlyIf { !skipAdminUi || !skipAuthUi }
}

tasks.register('adminUiBuild', Exec) {
    group = 'build'
    description = 'Build the admin-ui SPA into src/main/resources/static/admin.'
    dependsOn 'pnpmInstall'
    workingDir = uiRoot
    commandLine pnpmCommand(['--filter', 'admin-ui', 'run', 'build'])
    onlyIf { !skipAdminUi }
}

tasks.register('authUiBuild', Exec) {
    group = 'build'
    description = 'Build the auth-ui SPA into src/main/resources/static/auth.'
    dependsOn 'pnpmInstall'
    workingDir = uiRoot
    commandLine pnpmCommand(['--filter', 'auth-ui', 'run', 'build'])
    onlyIf { !skipAuthUi }
}

tasks.named('processResources') {
    dependsOn 'adminUiBuild', 'authUiBuild'
}

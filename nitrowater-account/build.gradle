plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.nitrowater'
version = '0.0.1-SNAPSHOT'
description = 'nitrowater-account'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":nitrowater-lib")
    implementation project(':nitrowater-core')
    // --- web ---
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Phase 2：OIDC Provider（SSO 门面）
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    // core 依赖的 crypto(BCrypt) 与 jose(JWT)
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.41'
    // --- persistence / cache（core 运行期所需，implementation 不传递，故在此重声明）---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework:spring-aop'
    implementation 'org.aspectj:aspectjweaver:1.9.25.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'

    // --- auth core 运行期库 ---
    implementation 'cn.hutool:hutool-captcha:5.8.26'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'org.jetbrains:annotations:26.0.2'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // --- 迁移 / JSON(Jackson 3) / 驱动 ---
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    implementation 'tools.jackson.core:jackson-databind'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Phase 1 本地运行：
//  - workingDir = 仓库根，使 application.yml 的 file:./deploy/keys/* 能解析
//  - 注入 NITROWATER_KEK（EncryptionHelper 读取的 32 字节 AES KEK，Base64）
tasks.named('bootRun') {
    workingDir = rootProject.projectDir
    environment 'NITROWATER_KEK', System.getenv('NITROWATER_KEK') ?: 'kElE+g/NUUkCAG0azg9ZcYYXbevGg9mYuUtJvICut98='
}

// 固定 bootJar 名称，便于根多目标 Dockerfile 提取（各服务同名 app.jar）。
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

// ============================================================
// admin-ui（Vue 3 SPA）构建接线
//  - `./gradlew build` 一次产出含管理台的完整 jar
//  - SPA 用 npm 构建，直接输出到 src/main/resources/static/admin（已 gitignore），
//    由 processResources 一并打包
//  - -PskipAdminUi：跳过（CI/Docker 里 SPA 已由独立的 node stage 构建完成）
// ============================================================
def adminUiDir = file('admin-ui')
def skipAdminUi = project.hasProperty('skipAdminUi')
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

// Windows 下 .cmd 需经 cmd /c 调用，Linux/macOS 直接用 npm。
def npmCommand = { List<String> args ->
    (isWindows ? ['cmd', '/c', 'npm'] : ['npm']) + args
}

tasks.register('adminUiInstall', Exec) {
    group = 'build'
    description = 'Install admin-ui dependencies (skipped when node_modules already exists).'
    workingDir = adminUiDir
    commandLine npmCommand(['install'])
    onlyIf { !skipAdminUi && !new File(adminUiDir, 'node_modules').exists() }
}

tasks.register('adminUiBuild', Exec) {
    group = 'build'
    description = 'Build the admin-ui SPA into src/main/resources/static/admin.'
    dependsOn 'adminUiInstall'
    workingDir = adminUiDir
    commandLine npmCommand(['run', 'build'])
    onlyIf { !skipAdminUi }
}

tasks.named('processResources') {
    dependsOn 'adminUiBuild'
}

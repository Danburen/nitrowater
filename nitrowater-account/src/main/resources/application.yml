# ============================================================
# nitrowater-account（SSO 认证中心）— 本地扁平配置
# Phase 1：不引入 shared config，所有项平铺于此。
# 配置项来源：复用 waterfun deploy/config/common.yml 的值（见注释）。
# ============================================================

server:
  port: 8090
  # Behind the nginx edge: build absolute redirect_uri / issuer-backed URLs from
  # X-Forwarded-Proto/Host instead of the container's http://account:8090.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Cross-site POSTs must not carry the SSO session (CSRF hardening). Lax keeps normal
        # top-level navigation working; all first-party flows are same-site anyway.
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true whenever the account host is served over TLS.
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: nitrowater-account

  # Real email delivery (app.communication.mode=real). Mock mode ignores these values.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

  # -------- 数据源（SSO 库：nitrowater_account，与业务库 nitrowater_biz 物理隔离；首次连接自动建库）--------
  datasource:
    url: jdbc:mysql://localhost:3306/nitrowater_account?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: "${DB_PASSWORD:123456}"   # 生产用 DB_PASSWORD 覆盖
    driver-class-name: com.mysql.cj.jdbc.Driver

  # -------- Redis --------
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      username: default
      password: "${REDIS_PASSWORD:}"
      repositories:
        enabled: false

  # -------- JPA --------
  # 建表改由 Flyway 管理（见下）；Hibernate 不自动改结构
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20

  # -------- Flyway（SSO 库基线）--------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  # -------- i18n（core 内置 messages.properties / messages_zh.properties）--------
  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: 3600s

  web:
    locale: zh_CN
    locale-resolver: accept_header
    # 静态资源：开发时优先读源码目录（改完刷新即生效，无需重启/重建）；打包后自动回退 classpath。
    # 依赖 workingDir=仓库根（与 jwt.private-key 的 file:./deploy/keys 一致）。
    resources:
      static-locations: "file:./nitrowater-account/src/main/resources/static/,classpath:/static/"
      cache:
        period: 0
  config:
    import:
      - optional:file:./deploy/config/common.yml
      - optional:file:./deploy/config/common-dev-secrets.yml

  jackson:
    mapper:
      accept-case-insensitive-enums: true

# -------- JWT（私钥仅 SSO 持有；公钥供网关）--------
# 密钥放 deploy/keys/（与 waterfun 一致；bootRun workingDir 已设为仓库根）
# jwt.issuer 是平台唯一签发者（single source of truth）：Phase1 自研 AT 与 AS(OIDC) 共用同一个 iss，
# 亦等于 AS 发现文档的 metadata.issuer。它必须是 URL（OIDC Discovery 规定），不能是裸词（如 "nitrowater"）。
# 由环境变量注入：dev 默认 http://localhost:8090；生产设 JWT_ISSUER=https://auth.nitrowater.cn。
# 注意：SPA 的 authority（前端 VITE_OIDC_AUTHORITY）必须与它一致，否则 oidc-client-ts 会拒绝该 issuer。
jwt:
  issuer: "${JWT_ISSUER:http://localhost:8090}"
  private-key: file:./deploy/keys/private.key
  public-key: file:./deploy/keys/public.key

# -------- 设备指纹（did 计算依赖；复用 waterfun 开发盐值）--------
device:
  salt: "${DEVICE_SALT:8c4uWcFWgRFFJHoE/MVnE8XpX4m3JQd5XtUj/tW13VA=}"   # 生产用 DEVICE_SALT 覆盖；dev 盐值禁止上生产
  temp:
    ttl: 3600
  short:
    ttl: 604800
  long:
    ttl: 7776000

# -------- 设备清理（DeviceServiceImpl 读取，复用 waterfun 值）--------
clean-up:
  device:
    max-days: 90

# -------- Token（复用 waterfun 值）--------
token:
  access:
    expiration: 7200      # 2h
  refresh:
    rotate: 604800        # 7d
    family: 2592000       # 30d

# -------- 验证码/邮件有效期（分钟/小时，复用 waterfun）--------
expire:
  email:
    verify: 5
    unverified-expire-hours: 24
  sms-code: 2
  captcha: 2

# RegisterServiceImpl 读取的字面量键（大小写敏感，勿改）
expiresIn:
  email:
    unverified-expiresIn-hours: 24

# -------- uid 生成器（复用 waterfun 值）--------
generator:
  uid:
    epoch: 1735689600000
    prefix: 1
    length: 10

# -------- SSO / OIDC --------
# OIDC issuer 统一取自 jwt.issuer（见上）：不再单独配置 sso.issuer，避免两份配置漂移。
# -------- CORS 白名单（同主域子域）--------
# 同主域：https://*.nitrowater.cn（跨主域 waterfun.top 已移除）
# 本地只放开真实前端端口（Vite 5173 / auth-ui dev 5175 / BFF 8080）。不要用 localhost:* —— 带凭证的
# 通配符让任意本地端口的页面都能读走 /api/auth/account 之类的个人数据。
# Cookie 属性（SameSite 等）统一在 server.servlet.session.cookie 下配置，见文件头部。
app:
  # Verification-code delivery. Local development defaults to mock: codes are logged, not sent.
  # Set COMMUNICATION_MODE=real plus the provider credentials below for production.
  # `real` with an unconfigured provider (SMTP / Aliyun SMS) degrades to logging instead of failing
  # the startup, so a local run still works; the missing keys are named in a startup WARN.
  # Aliyun SMS credentials are NOT config: they come from the standard environment variables
  # ALIBABA_CLOUD_ACCESS_KEY_ID / ALIBABA_CLOUD_ACCESS_KEY_SECRET (same names the Aliyun SDK uses).
  communication:
    mode: ${COMMUNICATION_MODE:mock}  # mock / real
    email:
      from: ${MAIL_FROM:}
    sms:
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
      endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
  # Hosted-login fallback when there is no saved request (no OIDC resume) and no explicit
  # redirect. It must point at the portal, never at /admin/.
  sso:
    default-redirect: "${SSO_DEFAULT_REDIRECT:http://localhost:5173}"
  # Hosted login 是顶层表单 POST：成功后 302 到待处理的 /oauth2/authorize，再 302 到客户端的
  # redirect_uri（跨域回跳是 OIDC 设计本身）。Chrome 会按 form-action 校验整条重定向链，所以回调
  # 域必须显式列出，否则导航被中止（此时会话已建立 → 表现为"停在登录页、刷新却已登录"）。
  # 只接受 scheme://host[:port]：不支持通配符、路径、逗号；非法值启动即失败。
  # 新增对外应用时，把它的 redirect_uri 域加进来（与 app.oidc.bff-redirect-uris 对齐）。
  csp:
    form-action-origins: "${SSO_FORM_ACTION_ORIGINS:http://localhost:5173,http://localhost:8080,https://nitrowater.cn}"
  cors:
    allowed-origin-patterns: "http://localhost:5173,http://localhost:5175,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:5175,http://127.0.0.1:8080,https://nitrowater.cn,https://*.nitrowater.cn"
  # 头像：OIDC picture claim 由 user.avatar_resource_uuid 派生（稳定读路径，非存储URL）。
  # 此处为资源服务对外的稳定基址；生产设 https://files.nitrowater.cn（或网关域名）。
  avatar:
    picture-base-url: "${AVATAR_PICTURE_BASE_URL:http://localhost:8093}"
  # access token 的 aud（RFC 9068：标识"这张票能在哪个资源上用"）。
  # 逗号分隔；始终追加 client_id，id_token 的 aud 不受影响（OIDC Core §2 要求 = client_id）。
  # Resource Server 用 app.security.jwt.audiences 校验这个值，两边要对齐。
  oidc:
    access-token-audiences: nitrowater-server
    # The account API is called only by the confidential BFF client. Keep this audience narrow
    # instead of accepting every token minted for the business API.
    account-api-audiences: nitrowater-bff
    # BFF（confidential client）——服务端持 AT/RT，唯一面向浏览器的客户端。
    # 密文由 seeder 用 DelegatingPasswordEncoder 编码后存入 oauth2_registered_client。
    # 必填：无内置默认值（启动缺变量即失败）。本地由 bin/start-all 或 bootRun 注入 dev 值，
    # 生产必须与 nitrowater-bff 用同一个强随机值。
    bff-client-secret: "${BFF_CLIENT_SECRET}"
    # 重定向 URI：dev 经 Vite 代理(5173) / 直接 BFF(8080)；prod 为门户域名。逗号分隔。
    bff-redirect-uris: "${BFF_REDIRECT_URIS:http://localhost:5173/login/oauth2/code/nitrowater,http://localhost:8080/login/oauth2/code/nitrowater,http://127.0.0.1:5173/login/oauth2/code/nitrowater,http://127.0.0.1:8080/login/oauth2/code/nitrowater,https://nitrowater.cn/login/oauth2/code/nitrowater}"
    # RP-initiated logout 回跳地址：逗号分隔。
    bff-post-logout-redirect-uris: "${BFF_POST_LOGOUT_REDIRECT_URIS:http://localhost:5173,http://localhost:5173/,http://localhost:8080,http://localhost:8080/,http://127.0.0.1:5173,http://127.0.0.1:5173/,http://127.0.0.1:8080,http://127.0.0.1:8080/,https://nitrowater.cn,https://nitrowater.cn/}"

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.springframework.orm.jpa: WARN
    org.springframework.transaction: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

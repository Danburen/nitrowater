# ============================================================
# nitrowater-account（SSO 认证中心）— 本地扁平配置
# Phase 1：不引入 shared config，所有项平铺于此。
# 配置项来源：复用 waterfun deploy/config/common.yml 的值（见注释）。
# ============================================================

server:
  port: 8090

spring:
  application:
    name: nitrowater-account

  # -------- 数据源（SSO 库：nitrowater_account，与业务库 nitrowater_biz 物理隔离；首次连接自动建库）--------
  datasource:
    url: jdbc:mysql://localhost:3306/nitrowater_account?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # -------- Redis --------
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      username: default
      password: ""
      repositories:
        enabled: false

  # -------- JPA --------
  # 建表改由 Flyway 管理（见下）；Hibernate 不自动改结构
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20

  # -------- Flyway（SSO 库基线）--------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  # -------- i18n（core 内置 messages.properties / messages_zh.properties）--------
  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: 3600s

  web:
    locale: zh_CN
    locale-resolver: accept_header
    # 静态资源：开发时优先读源码目录（改完刷新即生效，无需重启/重建）；打包后自动回退 classpath。
    # 依赖 workingDir=仓库根（与 jwt.private-key 的 file:./deploy/keys 一致）。
    resources:
      static-locations: "file:./nitrowater-account/src/main/resources/static/,classpath:/static/"
      cache:
        period: 0

  jackson:
    mapper:
      accept-case-insensitive-enums: true

# -------- JWT（私钥仅 SSO 持有；公钥供网关）--------
# 密钥放 deploy/keys/（与 waterfun 一致；bootRun workingDir 已设为仓库根）
# jwt.issuer 是平台唯一签发者（single source of truth）：Phase1 自研 AT 与 AS(OIDC) 共用同一个 iss，
# 亦等于 AS 发现文档的 metadata.issuer。它必须是 URL（OIDC Discovery 规定），不能是裸词（如 "nitrowater"）。
# 由环境变量注入：dev 默认 http://localhost:8090；生产设 JWT_ISSUER=https://auth.nitrowater.cn。
# 注意：SPA 的 authority（前端 VITE_OIDC_AUTHORITY）必须与它一致，否则 oidc-client-ts 会拒绝该 issuer。
jwt:
  issuer: "${JWT_ISSUER:http://localhost:8090}"
  private-key: file:./deploy/keys/private.key
  public-key: file:./deploy/keys/public.key

# -------- 设备指纹（did 计算依赖；复用 waterfun 开发盐值）--------
device:
  salt: 8c4uWcFWgRFFJHoE/MVnE8XpX4m3JQd5XtUj/tW13VA=
  temp:
    ttl: 3600
  short:
    ttl: 604800
  long:
    ttl: 7776000

# -------- 设备清理（DeviceServiceImpl 读取，复用 waterfun 值）--------
clean-up:
  device:
    max-days: 90

# -------- Token（复用 waterfun 值）--------
token:
  access:
    expiration: 7200      # 2h
  refresh:
    rotate: 604800        # 7d
    family: 2592000       # 30d

# -------- 验证码/邮件有效期（分钟/小时，复用 waterfun）--------
expire:
  email:
    verify: 5
    unverified-expire-hours: 24
  sms-code: 2
  captcha: 2

# RegisterServiceImpl 读取的字面量键（大小写敏感，勿改）
expiresIn:
  email:
    unverified-expiresIn-hours: 24

# -------- uid 生成器（复用 waterfun 值）--------
generator:
  uid:
    epoch: 1735689600000
    prefix: 1
    length: 10

# -------- SSO / OIDC --------
# OIDC issuer 统一取自 jwt.issuer（见上）：不再单独配置 sso.issuer，避免两份配置漂移。
# -------- CORS 白名单（同主域子域 + 跨主域）+ Cookie（跨站同上）--------
# 同主域：https://*.nitrowater.cn；跨主域：https://*.waterfun.top、https://waterfun.top
# Cookie：同站用 Strict/false；跨主域（waterfun.top↔nitrowater.cn）改 same-site=None + secure=true
app:
  cors:
    allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*,https://nitrowater.cn,https://*.nitrowater.cn,https://waterfun.top,https://*.waterfun.top"
  cookie:
    same-site: Strict
    secure: false

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.springframework.orm.jpa: WARN
    org.springframework.transaction: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

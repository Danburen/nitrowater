<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NitroWater</title>
</head>
<!--
  Shared chrome only: header, content slot, footer. Table-free single column with inline styles,
  because most mail clients strip <style> blocks and ignore modern layout.
-->
<body style="margin:0;padding:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
<div style="max-width:560px;margin:0 auto;padding:32px 16px;">

  <div style="padding:0 4px 16px;">
    <img th:if="${!#strings.isEmpty(logoUrl)}" th:src="${logoUrl}" th:alt="${'NitroWater'}"
         height="28" style="display:block;border:0;height:28px;">
    <span th:if="${#strings.isEmpty(logoUrl)}"
          style="font-size:18px;font-weight:600;color:#1f2430;letter-spacing:.5px;">NitroWater</span>
  </div>

  <div style="background:#ffffff;border-radius:8px;padding:28px 24px;border:1px solid #e6e8ec;">
    <div th:utext="${content}">邮件正文</div>
  </div>

  <div style="padding:16px 4px 0;font-size:12px;line-height:1.6;color:#9aa0ab;">
    此邮件由系统自动发送，请勿直接回复。<br>
    如果这不是您本人的操作，请忽略本邮件，您的账号不会受到影响。
  </div>

</div>
</body>
</html>

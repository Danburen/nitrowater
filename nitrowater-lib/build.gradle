plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.nitrowater'
version = '1.0.0'
description = 'nitrowater-lib'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // JsonUtil 的公开签名含 Jackson 类型（TypeReference/ObjectMapper）→ 必须 api 导出。
    // 全项目统一 Jackson 3（tools.jackson，Spring Boot 4 默认）；java.time 支持已内置于 databind。
    api 'tools.jackson.core:jackson-databind'
    implementation 'jakarta.validation:jakarta.validation-api'

    implementation 'org.jetbrains:annotations:26.0.2'
    implementation 'cn.hutool:hutool-core:5.8.26'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // stays web-free while still shipping the shared JSON envelope advice.

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 requires the platform launcher explicitly (other modules already declare it).
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 纯库：无主类 → 关 bootJar，产出普通 jar（与 nitrowater-core 一致）
tasks.named('bootJar') {
    enabled = false
}
tasks.named('jar') {
    enabled = true
}

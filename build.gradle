
plugins {
    id 'base'
}

allprojects {
    group = 'cn.nitrowater'
    version = '1.0.0'

    if (tasks.findByName('wrapper') == null) {
        tasks.register('wrapper')
    }
    if (tasks.findByName('prepareKotlinBuildScriptModel') == null) {
        tasks.register('prepareKotlinBuildScriptModel')
    }
}

repositories {
    maven { url = uri("https://maven.aliyun.com/repository/public") }
    maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
    mavenCentral()
}
tasks.register('classes')
tasks.register('testClasses')

// ============================================================
// Linux-only native dependencies
//  - The runtime images are Linux, but Netty (pulled in by Spring AI / gRPC) publishes one
//    native JAR per OS/arch: the macOS / Windows / *BSD ones can never be loaded there and are
//    dead weight inside the jar (~6 MB on server, ~2.5 MB each for the QUIC codec).
//  - Filtering bootJar's classpath keeps the useful ones (linux-x86_64, linux-aarch_64). It is
//    done on the task, not on the configuration, so `bootRun` / tests are untouched and
//    layers.idx is generated from the same filtered set the archive is built from.
//  - The rule is name-based because these arrive as classifier artifacts
//    (`...-osx-x86_64.jar`), which a configuration-level `exclude` cannot target.
// ============================================================
subprojects {
    plugins.withId('org.springframework.boot') {
        tasks.named('bootJar') { bootJar ->
            bootJar.classpath = bootJar.classpath.filter { file ->
                !(file.name ==~ /.*-(osx|windows|freebsd)-.*\.jar$/)
            }
        }
    }
}
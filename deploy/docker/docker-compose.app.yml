# ============================================================
# NitroWater 服务编排（account + resource + server + bff）
# 依赖 infra 已启动并共享 external 网络 nitrowater-net。
#
# 本地构建运行：
#   docker compose -f deploy/docker/docker-compose.app.yml up -d --build
# CI 部署：把各服务 build 换成 image（见各行注释），用 --env-file 注入 .env。
#
# 注意：issuer(JWT_ISSUER) 需“浏览器与服务都可达”。生产填对外域名；
#       本机纯 dev 建议用 bin/*.bat + bootRun（yml 默认指向 localhost）。
# ============================================================
name: nitrowater-app

services:
  account:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: account
    # image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/account:${IMAGE_TAG:-latest}
    container_name: nitrowater-account
    ports:
      - "8090:8090"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/nitrowater_account?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      WATERFUN_KEK: ${WATERFUN_KEK:?set WATERFUN_KEK in .env}
      DEVICE_SALT: ${DEVICE_SALT:-device-salt-dev}
    volumes:
      - ../keys:/app/deploy/keys:ro
    mem_limit: 640m
    restart: unless-stopped
    networks:
      - nitrowater-net

  resource:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: resource
    # image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/resource:${IMAGE_TAG:-latest}
    container_name: nitrowater-resource
    ports:
      - "8093:8093"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/nitrowater_resource?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      RESOURCE_BACKEND: ${RESOURCE_BACKEND:-s3}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-nitrowater}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-nitrowater}
      # ---- 腾讯 COS（可选：留空则只用 s3/local）----
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-ap-shanghai}
      COS_BUCKET: ${COS_BUCKET:-}
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - nitrowater-net

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: server
    # image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/server:${IMAGE_TAG:-latest}
    container_name: nitrowater-server
    ports:
      - "8081:8081"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/nitrowater_biz?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      PISTON_BASE_URL: http://piston:2000
    mem_limit: 640m
    restart: unless-stopped
    networks:
      - nitrowater-net

  bff:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: bff
    # image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/bff:${IMAGE_TAG:-latest}
    container_name: nitrowater-bff
    ports:
      - "8080:8080"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      RS_BASE_URL: http://server:8081
      RESOURCE_BASE_URL: http://resource:8093
      SPRING_DATA_REDIS_HOST: redis
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:-nitrowater-bff-secret}
    depends_on:
      - account
    volumes:
      # Plugin docs & download resources are independently built & published here
      # (see deploy/plugin-docs/README.md); the BFF serves /plugin/<name>/** (e.g.
      # /plugin/velochatx/docs/** and /plugin/velochatx/res/**) from this read-only mount.
      - ../plugin-docs:/app/deploy/plugin-docs:ro
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - nitrowater-net

networks:
  nitrowater-net:
    external: true

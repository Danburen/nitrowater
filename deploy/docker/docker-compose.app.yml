# ============================================================
# NitroWater 服务编排（account + resource + server + bff）
# 依赖 infra 已启动并共享 external 网络 nitrowater-net。
#
# 本地构建运行：
#   docker compose -f deploy/docker/docker-compose.app.yml up -d --build
# CI 部署：把各服务 build 换成 image（见各行注释），用 --env-file 注入 .env。
#
# 注意：issuer(JWT_ISSUER) 需“浏览器与服务都可达”。生产填对外域名；
#       本机纯 dev 建议用 bin/start-all.ps1 (java -jar)（yml 默认指向 localhost）。
# ============================================================
name: nitrowater-app

services:
  account:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: account
    # image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/account:${IMAGE_TAG:-latest}
    container_name: nitrowater-account
    ports:
      - "8090:8090"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/nitrowater_account?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      NITROWATER_KEK: ${NITROWATER_KEK:?set NITROWATER_KEK in .env}
      DEVICE_SALT: ${DEVICE_SALT:-device-salt-dev}
    volumes:
      - ../keys:/app/deploy/keys:ro
    mem_limit: 640m
    restart: unless-stopped
    networks:
      - nitrowater-net

  resource:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: resource
    # image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/resource:${IMAGE_TAG:-latest}
    container_name: nitrowater-resource
    ports:
      - "8093:8093"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/nitrowater_resource?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      RESOURCE_BACKEND: ${RESOURCE_BACKEND:-s3}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-nitrowater}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in deploy/docker/.env}
      S3_BUCKET: ${S3_BUCKET:-nitrowater}
      # ---- 腾讯 COS（可选：留空则只用 s3/local）----
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-ap-shanghai}
      COS_BUCKET: ${COS_BUCKET:-}
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - nitrowater-net

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: server
    # image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/server:${IMAGE_TAG:-latest}
    container_name: nitrowater-server
    ports:
      - "8081:8081"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/nitrowater_biz?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      PISTON_BASE_URL: http://piston:2000
      # ---- Documentation assistant (Spring AI) ----
      # Qdrant runs in docker-compose.infra.yml on the shared network.
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-${GLM_API_KEY:-not-configured}}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-glm-5.3-flash}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-${GLM_API_KEY:-not-configured}}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-embedding-3}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1024}
      # Web search uses DeepSeek's search API (`DEEPSEEK_API_KEY`); inactive when the key is absent.
      AI_WEB_SEARCH_ENABLED: ${AI_WEB_SEARCH_ENABLED:-true}
      AI_WEB_SEARCH_API_KEY: ${AI_WEB_SEARCH_API_KEY:-${DEEPSEEK_API_KEY:-}}
      AI_WEB_SEARCH_ENDPOINT: ${AI_WEB_SEARCH_ENDPOINT:-https://api.deepseek.com/v1/tools/search}
      AI_WEB_SEARCH_TIMEOUT_MS: ${AI_WEB_SEARCH_TIMEOUT_MS:-20000}
      # Documentation corpora come from the classpath (ai/docs/<corpus>) and are configured under
      # app.ai.collections; published sites (deploy/plugin-docs) are served by the docs container,
      # so the server needs neither the mount nor the legacy AI_DOCS_* variables.
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - nitrowater-net

  bff:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: bff
    # image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/bff:${IMAGE_TAG:-latest}
    container_name: nitrowater-bff
    ports:
      - "8080:8080"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      RS_BASE_URL: http://server:8081
      RESOURCE_BASE_URL: http://resource:8093
      SPRING_DATA_REDIS_HOST: redis
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?BFF_CLIENT_SECRET must be set in deploy/docker/.env}
      # The BFF only forwards /plugin/** to the docs container (no static files of its own).
      PLUGIN_DOCS_UPSTREAM: http://docs:80
    depends_on:
      - account
      - docs
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - nitrowater-net

  # Plugin docs: ONE container (nginx) hosting ALL plugin docs + downloads as static files.
  # Docs artifacts are independently built & published into ../plugin-docs
  # (see deploy/plugin-docs/README.md). The BFF forwards /plugin/<name>/** here.
  # Publishing a new plugin/version = rsync/scp the files (optionally `docker restart
  # nitrowater-docs` for immediate cache bust); no BFF restart and no image rebuild needed.
  docs:
    # image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/docs:${IMAGE_TAG:-latest}
    image: nginx:alpine
    container_name: nitrowater-docs
    ports:
      # dev: BFF runs on the host (gradle bootRun) and reaches http://localhost:8085
      # (the app.plugin-docs.upstream default). Loopback-only, so prod is not exposed.
      # prod: the in-network BFF uses PLUGIN_DOCS_UPSTREAM=http://docs:80 instead.
      - "127.0.0.1:8085:80"
    volumes:
      # Mounted at .../html/plugin so a URL /plugin/<name>/... maps to <host plugin-docs>/<name>/...
      # (matches the BFF's /plugin/** namespace and the old WebConfig resource handler).
      - ../plugin-docs:/usr/share/nginx/html/plugin:ro
      - ./docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - nitrowater-net

networks:
  nitrowater-net:
    external: true

# ============================================================
# NitroWater 业务面（app）
#   qdrant             : 只服务 server 的向量存储（资源字节落在宿主机目录）
#   piston             : 代码运行沙箱（常驻，privileged）
#   docs               : 插件文档站（内容来自 nitrowater-plugin-docs 的镜像，见 docker-compose.docs-local.yml 的本地覆盖）
#   resource / server / bff : 业务后端
#
# 前置（只需一次）：docker network create nitrowater-net
# 启动：docker compose --env-file deploy/docker/.env -f deploy/docker/docker-compose.app.yml up -d
# ============================================================
name: nitrowater-app

services:
  qdrant:
    image: qdrant/qdrant:v1.20.1
    container_name: nitrowater-qdrant
    ports:
      # Dashboard 无认证，只绑回环；gRPC 6334 不发布。
      - "${OPS_BIND:-127.0.0.1}:6333:6333"
    volumes:
      - nitrowater-qdrant:/qdrant/storage
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - nitrowater-net

  # 代码运行沙箱：常驻能力。需要 Linux + cgroup v2 + privileged。
  # 只连 runner-net，与 mysql/redis/qdrant 隔离；server 同时连两边。
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: nitrowater-piston
    privileged: true
    volumes:
      - "/tmp"
      - nitrowater-piston:/piston
    environment:
      LANG: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
      PISTON_RUN_TIMEOUT: "10000"
      PISTON_COMPILE_TIMEOUT: "20000"
      PISTON_RUN_MEMORY_LIMIT: "268435456"
      PISTON_COMPILE_MEMORY_LIMIT: "536870912"
      PISTON_OUTPUT_MAX_SIZE: "1048576"
      # 2 concurrent jobs at 512 MB compile each keeps the sandbox inside its 1 GB budget;
      # 8 (upstream default) let a single burst OOM the whole box.
      PISTON_MAX_CONCURRENT_JOBS: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://127.0.0.1:2000/api/v2/runtimes',x=>process.exit(x.statusCode===200?0:1));r.on('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024m
    restart: unless-stopped
    networks:
      - runner-net

  docs:
    # Content is BAKED INTO THE IMAGE: the plugin docs live in their own repo
    # (nitrowater-plugin-docs), whose CI builds and pushes one image holding every plugin site.
    # Nothing is uploaded to the host any more, so the content is versioned, rollback =
    # change DOCS_IMAGE_TAG, and the deploy workflow pulls it from the registry like any other service.
    #
    # The image must be built with DOCS_BASE_PREFIX=/plugin: a VitePress site's `base` is fixed at
    # build time and the public URL is /plugin/<id>/, so an image built with the default prefix
    # serves /<id>/ and every link 404s behind the BFF.
    #
    # The image is NOT built here: DOCS_IMAGE_REPO points at the docs repo (owner/nitrowater-plugin-docs),
    # because that repo is not GITHUB_REPOSITORY. Local dev overrides this service with a bind mount:
    # see docker-compose.docs-local.yml (the released image may not be pullable from a dev box).
    image: ${REGISTRY:-ghcr.io}/${DOCS_IMAGE_REPO:-your-org/nitrowater-plugin-docs}:${DOCS_IMAGE_TAG:-latest}
    container_name: nitrowater-docs
    ports:
      # 本地 bootRun 的 BFF 默认从这里取 /plugin/**；生产 BFF 走容器内 http://docs:80。
      - "127.0.0.1:8085:80"
    volumes:
      # Routing / cache policy stay in THIS repo on purpose: a content-only release must not be
      # able to change URLs or caching, and doc-site previews must behave like production.
      - ./docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # The deploy workflow waits on this; the endpoint is served by docs-nginx.conf (independent of content).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - nitrowater-net

  resource:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: resource
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/resource:${APP_IMAGE_TAG:-latest}
    container_name: nitrowater-resource
    ports:
      - "${PUBLISH_BIND:-127.0.0.1}:8093:8093"
    volumes:
      # 资源字节落在宿主机目录（bind mount）：备份就是 rsync/tar，重建容器不丢数据，
      # `compose down -v` 也删不到它。宿主机路径由 .env 的 RESOURCE_DATA_DIR 指定。
      - "${RESOURCE_DATA_DIR:?RESOURCE_DATA_DIR is required}:/data/resource"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/nitrowater_resource?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # 本地磁盘存储：唯一的数据面，必须与上面的 bind mount 对齐。
      RESOURCE_BACKEND: ${RESOURCE_BACKEND:-local}
      RESOURCE_LOCAL_PATH: /data/resource
      # 不开 direct-to-storage：上传/下载统一走 BFF 的 443 入口。
      RESOURCE_PRESIGN_ENABLED: ${RESOURCE_PRESIGN_ENABLED:-false}
      # 可选对象存储：只有腾讯 COS（默认本地磁盘，改 RESOURCE_BACKEND=cos 并填凭据即可切换）。
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-ap-shanghai}
      COS_BUCKET: ${COS_BUCKET:-}
      # 内部发布通道；留空 = 端点返回 503（fail-closed）。
      RESOURCE_INTERNAL_TOKEN: ${RESOURCE_INTERNAL_TOKEN:-}
      # 上传总闸；角色判定在服务内完成（仅 ROLE_ADMIN / ROLE_SUPER_ADMIN 可上传）。
      RESOURCE_UPLOAD_ENABLED: ${RESOURCE_UPLOAD_ENABLED:-true}
      RESOURCE_MAX_SIZE: ${RESOURCE_MAX_SIZE:-10485760}
      RESOURCE_PLUGIN_MAX_SIZE: ${RESOURCE_PLUGIN_MAX_SIZE:-67108864}
      RESOURCE_CACHE_MARGIN: ${RESOURCE_CACHE_MARGIN:-60}
      RESOURCE_JWT_AUDIENCES: ${RESOURCE_JWT_AUDIENCES:-nitrowater-resource}
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - nitrowater-net

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: server
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/server:${APP_IMAGE_TAG:-latest}
    container_name: nitrowater-server
    ports:
      - "${PUBLISH_BIND:-127.0.0.1}:8081:8081"
    # 只有 bff 带 healthcheck（唯一对外入口）；本服务靠 restart 策略 + 日志。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      # 浏览器跨域白名单（Bearer-only，不带 Cookie）。生产写真实站点域名。
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,https://nitrowater.cn,https://*.nitrowater.cn}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/nitrowater_biz?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=UTC&preserveInstants=true&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      PISTON_BASE_URL: ${PISTON_BASE_URL:-http://piston:2000}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-${DEEPSEEK_API_KEY:-not-configured}}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://api.deepseek.com}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-${SILICONFLOW_API_KEY:-not-configured}}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1024}
      AI_COLLECTION: ${AI_COLLECTION:-nitrowater_velochatx_docs}
      AI_MEMORY_RETENTION_DAYS: ${AI_MEMORY_RETENTION_DAYS:-180}
      AI_MEMORY_PURGE_DAYS: ${AI_MEMORY_PURGE_DAYS:-30}
      AI_MEMORY_CLEANUP_CRON: "${AI_MEMORY_CLEANUP_CRON:-0 15 3 * * *}"
      AI_USAGE_RETENTION_DAYS: ${AI_USAGE_RETENTION_DAYS:-31}
      AI_USAGE_GLOBAL_RETENTION_DAYS: ${AI_USAGE_GLOBAL_RETENTION_DAYS:-366}
      AI_USAGE_CLEANUP_CRON: "${AI_USAGE_CLEANUP_CRON:-0 45 4 * * *}"
      AI_WEB_SEARCH_ENABLED: ${AI_WEB_SEARCH_ENABLED:-true}
      AI_WEB_SEARCH_API_KEY: ${AI_WEB_SEARCH_API_KEY:-${DEEPSEEK_API_KEY:-}}
      AI_WEB_SEARCH_ENDPOINT: ${AI_WEB_SEARCH_ENDPOINT:-https://api.deepseek.com/v1/tools/search}
      AI_WEB_SEARCH_TIMEOUT_MS: ${AI_WEB_SEARCH_TIMEOUT_MS:-20000}
      # 词表默认只用镜像内基线；启用外置词表时在 .env 里加 file: 层（见 .env.example）。
      AI_MODERATION_DICT: ${AI_MODERATION_DICT:-classpath:ai/moderation/words.txt}
      AI_MODERATION_ALLOW: ${AI_MODERATION_ALLOW:-classpath:ai/moderation/allow.txt}
      AI_MODERATION_STRIKE_LIMIT: ${AI_MODERATION_STRIKE_LIMIT:-5}
      AI_MODERATION_STRIKE_WINDOW_MINUTES: ${AI_MODERATION_STRIKE_WINDOW_MINUTES:-10}
      AI_MODERATION_COOLDOWN_MINUTES: ${AI_MODERATION_COOLDOWN_MINUTES:-15}
      # 语料根；同一个值也是下面的挂载点，改它两边一起动（宿主机侧固定 ${CONTENT_ROOT}/docs）。
      AI_DOCS_ROOT: ${AI_DOCS_ROOT:-/etc/nitrowater/docs}
    volumes:
      # 内容目录常驻只读挂载；词表由 AI_MODERATION_DICT 启用，语料目录由 AI_DOCS_ROOT 自动发现。
      - ${CONTENT_ROOT:-../content}/moderation:/etc/nitrowater/moderation:ro
      - ${CONTENT_ROOT:-../content}/docs:${AI_DOCS_ROOT:-/etc/nitrowater/docs}:ro
    depends_on:
      - qdrant
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - nitrowater-net
      - runner-net

  bff:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: bff
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/nitrowater}/bff:${APP_IMAGE_TAG:-latest}
    container_name: nitrowater-bff
    ports:
      - "${PUBLISH_BIND:-127.0.0.1}:8080:8080"
    entrypoint:
      - sh
      - -c
      - |
        i=0
        until curl -fsS --max-time 3 "$$JWT_ISSUER/.well-known/openid-configuration" >/dev/null 2>&1; do
          i=$$((i+1))
          if [ "$$i" -gt 100 ]; then
            echo "issuer unreachable after 5m: $$JWT_ISSUER" >&2
            exit 1
          fi
          echo "waiting for $$JWT_ISSUER ..."
          sleep 3
        done
        exec java org.springframework.boot.loader.launch.JarLauncher
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:${MANAGEMENT_PORT:-9080}/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      VIRTUAL_HOST: ${WEB_DOMAIN:-}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${WEB_DOMAIN:-}
      LETSENCRYPT_EMAIL: ${SSL_EMAIL:-}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      RS_BASE_URL: http://server:8081
      RESOURCE_BASE_URL: http://resource:8093
      ACCOUNT_BASE_URL: http://account:8090
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:-nitrowater-bff-secret}
      # 免登录绝对上限（从最后一次输密码起算）；改大只是放宽容忍度，改小会让所有人提前重登。
      APP_SESSION_ABSOLUTE: ${APP_SESSION_ABSOLUTE:-30d}
      POST_LOGOUT_REDIRECT_URI: ${POST_LOGOUT_REDIRECT_URI:-http://localhost:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # 与 management.server.port 同源：改这个值，健康探测地址自动跟着变。
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-9080}
      PLUGIN_DOCS_UPSTREAM: http://docs:80
      # 用户协议 / 隐私政策纯文本：宿主目录挂载，按请求读取最新内容（不重新构建）。
      LEGAL_DIR: /etc/nitrowater/legal
    volumes:
      - ${CONTENT_ROOT:-../content}/legal:/etc/nitrowater/legal:ro
    depends_on:
      - server
      - resource
      - docs
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - nitrowater-net

networks:
  nitrowater-net:
    external: true
  # 沙箱隔离网络：只有 piston 和 server 加入。
  runner-net:
    name: nitrowater-runner-net

volumes:
  nitrowater-qdrant:
  nitrowater-piston:

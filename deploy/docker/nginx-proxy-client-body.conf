# Proxy-wide nginx settings for the edge profile (nginxproxy/nginx-proxy).
#
# Mounted at /etc/nginx/conf.d/*.conf, so nginx's `include conf.d/*.conf` picks it up alongside the
# generated default.conf.
#
# Resource uploads no longer go straight to an object store: they stream through the BFF, so the
# edge is on the upload path and its default limit (1m) would answer 413 for every plugin jar.
# Keep this >= RESOURCE_PLUGIN_MAX_SIZE (default 64 MB).
client_max_body_size 100m;

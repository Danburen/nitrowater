# ============================================================
# 本地 dev 的 docs 服务（独立文件，不是 override）
#
# 生产（docker-compose.app.yml）里的 docs 用镜像：内容由独立仓库 nitrowater-plugin-docs 的 CI
# 构建进镜像。本地既不该每次改一行文档就 build/push 镜像，也不一定拉得到它，所以这里把内容
# 换成 bind mount。
#
#   docker compose -f deploy/docker/docker-compose.docs-local.yml up -d docs
#   # 或 bin\start-infra.ps1（用它）
#
# 为什么不做成 override：app 那份 compose 有 `${DB_PASSWORD:?}` 这类必填变量，dev 机上没有生产
# .env，`-f base -f override` 会在插值阶段就失败。这里只声明 docs，零依赖。
#
# URL 与线上完全一致（容器内 webroot = /usr/share/nginx/html，与镜像相同）：
#   /plugin/<id>/        该插件的文档站
#   （没有门户页 / 清单：/plugin/ 本身 404，入口由 SPA 的插件中心提供）
#
# 内容来源 DOCS_SITE_DIR，默认 ../../../nitrowater-plugin-docs/dist（与本仓库同级），必须是这样
# 构建出来的树：`DOCS_BASE_PREFIX=/plugin npm run build` —— 因为站点 base 是构建期固定的，
# 而对外 URL 是 /plugin/<id>/。用默认前缀构建（/<id>/）挂进来会 404，这是唯一要记住的约定。
#
# 改完要重建容器才生效：docker rm -f nitrowater-docs && bin\start-infra.ps1
# ============================================================
name: nitrowater-app

services:
  docs:
    # 本地用上游 nginx（内容来自挂载），不用 registry 里的文档站镜像。
    # 想直接验证真实产物：在文档仓库 `docker build --build-arg DOCS_BASE_PREFIX=/plugin -t
    # nitrowater-plugin-docs:local .`，再把这里换成 image: nitrowater-plugin-docs:local 并去掉挂载。
    image: nginx:stable-alpine
    container_name: nitrowater-docs
    ports:
      # 本地 bootRun 的 BFF 默认从这里取 /plugin/**（app.plugin-docs.upstream）。
      - "127.0.0.1:8085:80"
    volumes:
      # 与镜像同一个 webroot，所以 dev 和生产的 URL / 缓存行为一模一样。
      - ${DOCS_SITE_DIR:-../../../nitrowater-plugin-docs/dist}:/usr/share/nginx/html:ro
      # routing / cache policy：与生产共用同一份，不复制。
      - ./docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - nitrowater-net

networks:
  nitrowater-net:
    external: true

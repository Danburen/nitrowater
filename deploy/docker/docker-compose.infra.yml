# ============================================================
# NitroWater 基础设施编排（有状态中间件：MySQL + Redis + SeaweedFS）
# 与服务编排（docker-compose.app.yml）分离，独立部署。
#
# 用法：
#   docker network create nitrowater-net        # 只需一次
#   docker compose -f deploy/docker/docker-compose.infra.yml up -d
#
# 环境变量经同目录 .env 注入（模板见 .env.example），缺失走默认（便于本地 dev）。
# ============================================================
name: nitrowater-infra

services:
  mysql:
    image: mysql:8.0
    container_name: nitrowater-mysql
    # 不映射宿主端口：仅内网可达（避免与宿主本地 MySQL 冲突）。需要宿主访问时按需加 ports。
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: nitrowater_account
    volumes:
      - nitrowater-mysql:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --max-connections=50
      --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - nitrowater-net

  redis:
    image: redis:7-alpine
    container_name: nitrowater-redis
    # 不映射宿主端口：仅内网可达（避免与宿主本地 Redis 冲突）。
    volumes:
      - nitrowater-redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - nitrowater-net

  # Third-party vector index for the documentation assistant (Spring AI Qdrant store).
  # 6333 = REST + web UI, 6334 = gRPC (what the Java client uses).
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: nitrowater-qdrant
    ports:
      # Loopback by default: the dashboard has NO authentication of its own, so it must not be
      # reachable from the network. Ops use `deploy/bin/ops-tunnel.*` (ssh -L) and open
      # http://127.0.0.1:6333/dashboard. 6334 (gRPC) is container-only - never publish it.
      - "${OPS_BIND:-127.0.0.1}:6333:6333"
    volumes:
      - nitrowater-qdrant:/qdrant/storage
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - nitrowater-net

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: nitrowater-seaweedfs
    ports:
      # S3 (:8333) stays reachable from the host because dev clients AND presigned URLs are
      # generated for it; the filer (:8888) and master (:9333) UIs have no auth, so they are
      # loopback-only and reached through the SSH tunnel. :23646 (volume) is never published.
      - "${OPS_BIND:-127.0.0.1}:8333:8333"
      - "${OPS_BIND:-127.0.0.1}:8888:8888"
      - "${OPS_BIND:-127.0.0.1}:9333:9333"
    volumes:
      - nitrowater-seaweedfs:/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-nitrowater}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-nitrowater}
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - nitrowater-net

networks:
  nitrowater-net:
    external: true

volumes:
  nitrowater-mysql:
  nitrowater-redis:
  nitrowater-qdrant:
  nitrowater-seaweedfs:

# ============================================================
# NitroWater 基础设施（共享基座）
#   mysql / redis : 所有服务共用的有状态后端
#   edge profile  : 公网入口 + 自动 TLS（仅生产启用）
#
# 前置（只需一次）：docker network create nitrowater-net
# 启动：docker compose --env-file deploy/docker/.env -f deploy/docker/docker-compose.infra.yml up -d
# 带公网：docker compose ... --profile edge up -d
# ============================================================
name: nitrowater-infra

services:
  mysql:
    image: mysql:8.0
    container_name: nitrowater-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: nitrowater_account
    volumes:
      - nitrowater-mysql:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --max-connections=50
      --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - nitrowater-net

  redis:
    image: redis:7-alpine
    container_name: nitrowater-redis
    volumes:
      - nitrowater-redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - nitrowater-net

  # ---- 公网入口（profile: edge）----
  # 只有这里发布 80/443；account / bff 通过 VIRTUAL_HOST 被自动发现。
  nginx-proxy:
    profiles: ["edge"]
    image: nginxproxy/nginx-proxy:1.7-alpine
    container_name: nitrowater-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      HTTPS_METHOD: redirect
      TRUST_DOWNSTREAM_PROXY: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
    mem_limit: 96m
    restart: unless-stopped
    networks:
      - nitrowater-net

  # 按容器的 LETSENCRYPT_HOST 自动签发 / 续期证书（HTTP-01）。
  acme-companion:
    profiles: ["edge"]
    image: nginxproxy/acme-companion:2.3
    container_name: nitrowater-acme
    environment:
      DEFAULT_EMAIL: ${SSL_EMAIL:-}
      NGINX_PROXY_CONTAINER: nitrowater-nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - acme_state:/etc/acme.sh
    depends_on:
      - nginx-proxy
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - nitrowater-net

networks:
  nitrowater-net:
    external: true

volumes:
  nitrowater-mysql:
  nitrowater-redis:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  acme_state:

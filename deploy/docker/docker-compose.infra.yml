# ============================================================
# NitroWater 基础设施（共享基座）
#   mysql / redis : 所有服务共用的有状态后端
#   edge profile  : 公网入口 + 自动 TLS（仅生产启用）
#
# 前置（只需一次）：docker network create nitrowater-net
# 库/账号初始化是手工一步（deploy/docs/bootstrap.md §5），这里不挂 initdb 脚本。
# 启动：docker compose --env-file deploy/docker/.env -f deploy/docker/docker-compose.infra.yml up -d
# 带公网：docker compose ... --profile edge up -d
# ============================================================
name: nitrowater-infra

services:
  mysql:
    image: mysql:8.0
    container_name: nitrowater-mysql
    environment:
      # root 只用于首次手工建库 / 运维；业务连接走 DB_USERNAME（见 deploy/docs/bootstrap.md §5）。
      # 必填：没填时 compose 直接拒绝启动，而不是回落到 123456 / root。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - nitrowater-mysql:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --max-connections=50
      --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - nitrowater-net

  redis:
    image: redis:7-alpine
    container_name: nitrowater-redis
    volumes:
      - nitrowater-redis:/data
    # 口令由 compose 从 .env 插值到命令行（不是 sh -c 里再展开一次）；必填。
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - nitrowater-net

  # ---- 公网入口（profile: edge）----
  # 只有这里发布 80/443；account / bff 通过 VIRTUAL_HOST 被自动发现。
  nginx-proxy:
    profiles: ["edge"]
    image: nginxproxy/nginx-proxy:1.7-alpine
    container_name: nitrowater-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      HTTPS_METHOD: redirect
      TRUST_DOWNSTREAM_PROXY: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
    mem_limit: 96m
    restart: unless-stopped
    networks:
      - nitrowater-net

  # 按容器的 LETSENCRYPT_HOST 自动签发 / 续期证书（HTTP-01）。
  acme-companion:
    profiles: ["edge"]
    image: nginxproxy/acme-companion:2.3
    container_name: nitrowater-acme
    environment:
      DEFAULT_EMAIL: ${SSL_EMAIL:-}
      NGINX_PROXY_CONTAINER: nitrowater-nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - acme_state:/etc/acme.sh
    depends_on:
      - nginx-proxy
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - nitrowater-net

networks:
  nitrowater-net:
    external: true

volumes:
  nitrowater-mysql:
  nitrowater-redis:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  acme_state:

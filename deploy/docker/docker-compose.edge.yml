# ============================================================
# NitroWater 公网边缘层：TLS + 自动证书（可选叠加，生产用）
#
# 叠加在 app 之上（同一 nitrowater-net）：
#   docker compose -f docker-compose.app.yml -f docker-compose.edge.yml up -d
#   或 deploy/bin/deploy.ps1 -Edge / deploy.sh --edge
#
# 暴露面只有这里：80/443。app 与 infra 的端口都绑 127.0.0.1（PUBLISH_BIND / OPS_BIND），
# 公网只能经 nginx-proxy 进来；Qdrant / SeaweedFS 的 UI 一律不走边缘，用 SSH 隧道
# （deploy/bin/ops-tunnel.*）。
#
# 证书：acme-companion 根据容器的 LETSENCRYPT_HOST 自动签发 + 续期（HTTP-01，需要 80 端口
# 公网可达、DNS A 记录指向本机）。内网-only 的域名拿不到公网证书，改用 DNS-01 或自签。
#
# 前置：docker network create nitrowater-net（只一次）
# ============================================================

name: nitrowater-edge

services:
  # ---------- 反向代理 + 证书存储 ----------
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.7-alpine
    container_name: nitrowater-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 所有 vhost 默认把 http 永久重定向到 https（ACME 的 /.well-known 仍由 companion 放行）。
      HTTPS_METHOD: redirect
      # 只信任来自这些网段的 X-Forwarded-*（容器网络）。
      TRUST_DOWNSTREAM_PROXY: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
    mem_limit: 96m
    restart: unless-stopped
    networks:
      - nitrowater-net

  # ---------- Let's Encrypt 自动签发 / 续期 ----------
  acme-companion:
    image: nginxproxy/acme-companion:2.3
    container_name: nitrowater-acme
    environment:
      DEFAULT_EMAIL: ${SSL_EMAIL:?SSL_EMAIL must be set (certificate contact)}
      NGINX_PROXY_CONTAINER: nitrowater-nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - acme_state:/etc/acme.sh
    depends_on:
      - nginx-proxy
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - nitrowater-net

  # ---------- 公开的服务：业务 SPA + 登录中心 ----------
  # 只声明 VIRTUAL_HOST，不再额外发布端口：nginx-proxy 通过容器网络访问它们。
  # WEB_DOMAIN 可写逗号列表（例如 nitrowater.cn,www.nitrowater.cn），证书会一并申请。
  bff:
    environment:
      VIRTUAL_HOST: ${WEB_DOMAIN:?WEB_DOMAIN must be set (public site host)}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${WEB_DOMAIN:?WEB_DOMAIN must be set (public site host)}
      LETSENCRYPT_EMAIL: ${SSL_EMAIL:?SSL_EMAIL must be set (certificate contact)}
      # 浏览器 -> 边缘是 https，BFF 需要据此写带 Secure 标志的会话 cookie。
      SESSION_COOKIE_SECURE: "true"

  account:
    environment:
      VIRTUAL_HOST: ${AUTH_DOMAIN:?AUTH_DOMAIN must be set (SSO host, e.g. auth.example.com)}
      VIRTUAL_PORT: 8090
      LETSENCRYPT_HOST: ${AUTH_DOMAIN:?AUTH_DOMAIN must be set (SSO host, e.g. auth.example.com)}
      LETSENCRYPT_EMAIL: ${SSL_EMAIL:?SSL_EMAIL must be set (certificate contact)}
      SESSION_COOKIE_SECURE: "true"

  # User-facing uploads (images / attachments) stay off until the moderation flow ships. The
  # endpoints remain mapped and answer 503 uploads_disabled; admin + internal plugin publishing
  # are unaffected. Set RESOURCE_USER_UPLOAD=true in .env to re-enable.
  resource:
    environment:
      RESOURCE_USER_UPLOAD: "${RESOURCE_USER_UPLOAD:-false}"

  # ---------- 站点文档（可选）：把 docs 容器也接到边缘 ----------
  # 默认 BFF 在容器网络内代理 /plugin/**（PLUGIN_DOCS_UPSTREAM=http://docs:80），不需要边缘
  # vhost。只有想让文档脱离 BFF 独立成站时才启用下面这段：
  #
  # docs:
  #   environment:
  #     VIRTUAL_HOST: ${DOCS_DOMAIN:-}
  #     VIRTUAL_PORT: 80
  #     LETSENCRYPT_HOST: ${DOCS_DOMAIN:-}
  #     LETSENCRYPT_EMAIL: ${SSL_EMAIL:-}

  # ---------- 对象存储（默认不暴露，见 env-vars-reference §10） ----------
  # resource 服务对"可内联渲染"的类型（头像/图片/PDF）返回 **presigned 重定向**，浏览器会直接
  # 去访问 S3 端点。S3 只在 127.0.0.1 上时这些图片在生产会加载失败（插件 Jar 不受影响，走
  # resource 流式下载）。三种处理任选：
  #   1) 接受降级：内联图片不可见；
  #   2) RESOURCE_BACKEND=local：全部走 resource 流式，代价是带宽经服务；
  #   3) 打开下面的 S3 vhost，并把 S3_PUBLIC_ENDPOINT 设为 https://${S3_DOMAIN}。
  #
  # s3:
  #   environment:
  #     VIRTUAL_HOST: ${S3_DOMAIN:-fs.example.com}
  #     VIRTUAL_PORT: 8333
  #     LETSENCRYPT_HOST: ${S3_DOMAIN:-fs.example.com}
  #     LETSENCRYPT_EMAIL: ${SSL_EMAIL:?}

networks:
  nitrowater-net:
    external: true

volumes:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  acme_state:

# nginx.conf for the plugin-docs container (a single container hosting ALL plugin docs).
#
# Layout on disk (read-only mount at /usr/share/nginx/html):
#   plugin/<name>/docs/...   the VitePress site      -> /plugin/<name>/docs/...
#
# NOTE: downloadable jars are NOT served from here anymore - they live in the unified resource
# service (nitrowater-resource, :8093) behind /api/public/resource/** (see bin/dev/sync-res.ps1).
#
# Publishing a new plugin or a new version is a pure file operation (rsync/scp/MIR + optional
# `docker restart nitrowater-docs`); the BFF forwards /plugin/** here, so no web build and no
# BFF restart are needed either.
server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # The BFF forwards the request verbatim (it cannot rewrite the client Host on the upstream
  # hop), so emit RELATIVE redirects (e.g. /plugin/x/docs/ -> /plugin/x/docs/) that stay valid
  # behind the BFF.
  absolute_redirect off;

  # Plugin docs: files first, then a directory's index.html, else 404.
  location /plugin/ {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Content-hashed bundles (Vite/VitePress): safe to cache hard.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # HTML/JSON: revalidate every time so a new publish is picked up immediately.
  location ~* \.(html|json)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
}

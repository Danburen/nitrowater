# ============================================================
# nginx.conf for the docs container. It serves the static tree that the
# nitrowater-plugin-docs image bakes in:
#
#   plugin/<id>/...   -> /plugin/<id>/...    one VitePress site (its build-time base)
#
# The site builds ONE base per plugin, so the mount path IS the public URL: the image is built
# with DOCS_BASE_PREFIX=/plugin (Dockerfile ARG), which is why /plugin/<id>/ resolves here and
# any other prefix 404s.
#
# There is NO portal page and NO manifest: /plugin/ itself is 404 on purpose - the plugin centre
# in the SPA owns the entry points, and the doc sites are linked per plugin.
#
# WHY THIS FILE LIVES IN THE DEPLOY REPO AND NOT IN THE IMAGE: routing and cache policy belong to
# the deployment. A content-only release must not be able to change URLs or caching, and the dev
# preview must behave exactly like production. Changes here are effective after
# `docker restart nitrowater-docs` (or `nginx -s reload` inside the container).
#
# Downloadable jars are NOT served from here: they live in the unified resource service
# (nitrowater-resource, :8093) behind /api/public/resource/**.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The BFF forwards requests verbatim (it cannot rewrite the client Host on the upstream hop),
  # so emit RELATIVE redirects ("/plugin/x/" instead of "http://docs/plugin/x/").
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/javascript application/manifest+json image/svg+xml;

  # Liveness for the compose healthcheck and the deploy probe: independent of the content.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Nothing legitimately serves the webroot root: the BFF only forwards /plugin/**, and the
  # base image ships a "Welcome to nginx" index.html that must never answer as the docs home.
  location = / {
    return 404;
  }

  # A plugin site root without the trailing slash: add it, so relative links and the directory
  # index resolve the same way they do on the rest of the site.
  location ~ ^/plugin/[a-z0-9_-]+$ {
    return 301 $uri/;
  }

  # Real files first, then cleanUrls-style "$uri.html", then the directory index, else 404.
  # No bare `$uri/` step: that would turn a directory without an index into 403 instead of 404.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
    # Anything that reaches this location is HTML (a directory index or a cleanUrls page) - assets
    # always match one of the regex blocks below. Keep those revalidating, or a republished page
    # stays masked by a heuristically cached copy.
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Content-hashed bundles (Vite/VitePress): safe to cache hard.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # HTML/JSON: revalidate every time, so a republished page is not masked by the browser.
  location ~* \.(html|json)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
}

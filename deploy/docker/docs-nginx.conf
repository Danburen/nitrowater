# nginx.conf for plugin docs container (single container hosting all static docs)
server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Serve plugin docs and download resources under /plugin/<name>/**
  # Files are laid out as: plugin/<name>/docs/... and plugin/<name>/res/...
  location /plugin/ {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Long-cache for hashed assets (common in Vite/VitePress)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # HTML/JSON: no long cache
  location ~* \.(html|json)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
}

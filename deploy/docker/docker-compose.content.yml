# ============================================================
# 内容解耦叠加层：把「词表 / 文档语料 / 外部 skills」从镜像里搬出来
#
# 用法（默认部署行为完全不变，只有显式叠加本文件才生效）：
#   docker compose -f docker-compose.app.yml -f docker-compose.content.yml up -d
#
# 前置：宿主机目录 deploy/content/{moderation,docs,skills}，见 deploy/content/README.md
# 上线前自检：deploy/bin/check-env.ps1（Windows）/ check-env.sh（Linux）
# ============================================================

services:
  server:
    volumes:
      # 违禁词（只读）。改完 POST /api/admin/ai/moderation/reload 生效，无需重启。
      - ${CONTENT_ROOT:-../content}/moderation:/etc/nitrowater/moderation:ro
      # 外置文档语料（只读）。改完 POST /api/admin/ai/reindex 生效（全量重建，建议低峰）。
      - ${CONTENT_ROOT:-../content}/docs:/etc/nitrowater/docs:ro
      # 外部技能（只读，可选）：<dir>/<name>/SKILL.md
      - ${CONTENT_ROOT:-../content}/skills:/etc/nitrowater/skills:ro
    environment:
      # 双层叠加：classpath 基线（随镜像走）+ 挂载增量。
      # 挂载丢失时基线仍在位，闸门不会静默失效 —— 不要把这里改成只用 file: 单层。
      AI_MODERATION_DICT: classpath:ai/moderation/words.txt,file:/etc/nitrowater/moderation/words.txt
      AI_MODERATION_ALLOW: classpath:ai/moderation/allow.txt,file:/etc/nitrowater/moderation/allow.txt
      # 文档语料默认仍取镜像内 classpath；要完全解耦就把 AI_DOCS_LOCATION 指到挂载目录：
      #   AI_DOCS_LOCATION=/etc/nitrowater/docs/nitrowater     （纯路径；file:/... 也接受）
      # 注意：指向的目录必须至少有 1 个 .md，否则该 corpus 重建后会从索引中消失。
      APP_AI_COLLECTIONS_1_LOCATION: ${AI_DOCS_LOCATION:-classpath:ai/docs/nitrowater}
      # 外部技能目录（内置技能仍在 classpath，同名外部文件覆盖内置）。
      AI_SKILLS_DIR: ${AI_SKILLS_DIR:-/etc/nitrowater/skills}

# ============================================================
# NitroWater 执行基础设施：Piston（代码运行沙箱）
# 按需启用（代码运行器）。硬约束：--privileged、Linux 内核、cgroup v2（须禁用 v1）、/piston 卷。
# 端口不映射宿主：仅内网 nitrowater-net 可达（server 经 http://piston:2000 调用）。
# 语言预装：自建镜像 `FROM ghcr.io/engineer-man/piston` + `cli/index.js ppman install java c c++`，
#           或首启后 `docker exec ... cli/index.js ppman install ...`。
#
# 用法：
#   docker compose -f deploy/docker/docker-compose.piston.yml up -d
#   （仅适用于 server 也在容器内的部署：此文件不映射宿主端口，容器内用 http://piston:2000）
#   本机跑 server（java -jar / bootRun）请改用 `.\bin\start-infra.ps1`：它会 -p 2000:2000，
#   与 application.yml 的默认 PISTON_BASE_URL=http://localhost:2000 对齐。
# ============================================================
name: nitrowater-piston

services:
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: nitrowater-piston
    privileged: true
    volumes:
      - "/tmp"                     # 匿名卷（isolate 需要可执行 /tmp）
      - nitrowater-piston:/piston  # 语言包持久化
    environment:
      # NOTE: container-level LANG/LC_ALL are NOT sufficient by themselves - Piston runs each job
      # inside an `isolate` sandbox that CLEARS the environment, so the JVM never sees these and
      # falls back to the ASCII platform charset (CJK source -> U+FFFD, output -> '?').
      # The real fix is bin/dev/install-piston-langs.ps1, which patches the java package's `run`
      # script to export a UTF-8 locale + force the JVM encodings. Kept here only for any
      # non-sandboxed use / to document intent.
      LANG: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
      PISTON_RUN_TIMEOUT: "10000"
      PISTON_COMPILE_TIMEOUT: "20000"
      PISTON_RUN_MEMORY_LIMIT: "268435456"
      PISTON_COMPILE_MEMORY_LIMIT: "536870912"
      PISTON_OUTPUT_MAX_SIZE: "1048576"
      PISTON_MAX_CONCURRENT_JOBS: "8"
    mem_limit: 1024m
    restart: unless-stopped
    networks:
      - nitrowater-net

networks:
  nitrowater-net:
    external: true

volumes:
  nitrowater-piston:

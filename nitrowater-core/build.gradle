plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.nitrowater'
version = '0.0.1-SNAPSHOT'
description = 'nitrowater-core'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Shared library for every service: entities, repositories, auth/security utilities and the
// Spring MVC/Security JSON plumbing (cn.nitrowater.core.web: ApiResponse advice, global exception
// handler, 401/403 JSON writers).
//
// The data stack is compileOnly on purpose. Nothing here calls Flyway / JdbcTemplate / EntityManager
// directly: entities only carry jakarta.persistence annotations and repositories only extend
// JpaRepository. Every persisting service (account / server / resource) declares the starters
// itself, so the BFF can depend on this module without dragging JPA + a DataSource into its runtime
// - a DataSource-less BFF would otherwise fail to start.
dependencies {
    api project(':nitrowater-lib')
    // Exported through public signatures: the ApiResponse advice and the 401/403 handlers implement
    // Spring MVC / Security types, so consumers compile against them.
    api 'org.springframework:spring-webmvc'
    api 'org.springframework.security:spring-security-web'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    compileOnly 'org.slf4j:slf4j-api'

    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework:spring-aop'
    implementation 'org.aspectj:aspectjweaver:1.9.25.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework:spring-web'
    implementation 'cn.hutool:hutool-captcha:5.8.26'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'org.jetbrains:annotations:26.0.2'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'tools.jackson.core:jackson-databind'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Pure library module: no main class — disable bootJar, publish plain jar
tasks.named('bootJar') {
    enabled = false
}
tasks.named('jar') {
    enabled = true
}

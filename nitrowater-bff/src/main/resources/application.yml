# ============================================================
# nitrowater-bff（Backend-for-Frontend / Token Handler）
# 浏览器零 token：只有 HttpOnly 会话 Cookie；AT/RT 由本服务持有。
# 同源托管 SPA 构建产物（nitrowater-web/dist），/api/** 代理到 RS。
# ============================================================

server:
  port: 8080
  # Behind the nginx edge the browser speaks https while Tomcat sees plain http. Honour
  # X-Forwarded-Proto/Host so redirects, the OIDC callback and the session cookie keep the
  # external scheme and host (otherwise the SPA bounces to http:// or the wrong host).
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: BFFSESSION
        http-only: true
        same-site: lax
        # Dev runs over plain http. A TLS deployment must set SESSION_COOKIE_SECURE=true, otherwise
        # the browser will happily send the session cookie over http as well.
        secure: ${SESSION_COOKIE_SECURE:false}

# -------- Actuator：只有 health，且只落在独立的管理端口 --------
# `server.port` (8080) is the only surface the reverse proxy may reach. Health lives on its own
# connector (9080) that compose does NOT publish — it is reachable from inside the container
# (that is where the healthcheck runs) and from nowhere else. Only `health` is exposed; never
# `env`/`configprops`/`heapdump`, which leak secrets and live credentials.
management:
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

spring:
  application:
    name: nitrowater-bff

  # -------- Multipart: deliberately OFF --------
  # This service is a pure streaming proxy: /api/** is copied byte-for-byte to a downstream
  # service. With the resolver enabled, Spring MVC's DispatcherServlet wraps every multipart/*
  # request in a StandardMultipartHttpServletRequest BEFORE the handler runs, which parses (and
  # drains) the request body. The proxy then streams an already-consumed input stream while still
  # declaring the original Content-Length, so the downstream receives a truncated body and dies
  # with "Failed to parse multipart servlet request" (skill import, jar upload, ...).
  # Multipart parsing belongs to the service that owns the upload endpoint; the BFF must not touch
  # the body.
  servlet:
    multipart:
      enabled: false

  # -------- Redis（会话存储；无数据库）--------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      username: default
      password: "${REDIS_PASSWORD:}"

  # -------- Spring Session → Redis（OAuth2AuthorizedClient(AT/RT) 随之持久化）--------
  # Boot 4.0 起，属性前缀由 spring.session.redis.* 更名为 spring.session.data.redis.*
  # （迁移指南：Spring Session Data Redis properties renamed）。只写新前缀，避免弃用告警。
  session:
    data:
      redis:
        namespace: nitrowater:bff:session
        # immediate: the refresh token is rotated on every refresh (reuseRefreshTokens=false), so the
        # new pair must be durable before the response commits. With on_save the write waits for the
        # request to finish — a long SSE response (or a concurrent request writing its own copy) can
        # lose the rotated token, and the next refresh then fails with invalid_grant.
        flush-mode: immediate

  # -------- OIDC Client：confidential，服务端持 RT --------
  # 官方属性 issuer-uri：启动时即拉 OIDC 发现文档 → **AS(account :8090) 必须先启动**，
  # 否则 BFF 启动失败（Unable to resolve Configuration with the provided Issuer）。
  # 生产按发布顺序保证：account → bff。
  security:
    oauth2:
      client:
        registration:
          nitrowater:
            provider: nitrowater
            client-id: nitrowater-bff
            client-secret: ${BFF_CLIENT_SECRET}
            client-name: NitroWater SSO
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile
        provider:
          nitrowater:
            issuer-uri: ${JWT_ISSUER:http://localhost:8090}

  # -------- 静态资源：统一由 WebConfig 处理（/assets/** 长缓存；/** 回退 index.html 且不缓存）--------
  # 关掉 Boot 默认静态映射，避免和 WebConfig 的 /** 处理器重复/抢优先级。
  web:
    resources:
      add-mappings: false

  # SSE (AI chat) keeps a servlet async request open while the model streams. The container
  # default (30s) is too short for long answers.
  mvc:
    async:
      request-timeout: 180s

# -------- 业务资源服务（RS）--------
app:
  rs:
    base-url: ${RS_BASE_URL:http://localhost:8081}
  # 统一资源服务（/api/resource/** 与 /api/public/resource/** 路由到这里）
  resource:
    base-url: ${RESOURCE_BASE_URL:http://localhost:8093}
  account:
    base-url: ${ACCOUNT_BASE_URL:http://localhost:8090}
  # Downstream call budget: must exceed the resource server's sandbox compile+run budget.
  api:
    # Connection phase only. A down service fails fast; an unreachable host (packets dropped) no
    # longer pins a request thread forever, because the JDK client has no default connect timeout.
    connect-timeout-ms: ${API_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${API_READ_TIMEOUT_MS:45000}
  web:
    # Vite 产物 assets/* 文件名带内容 hash → 可长缓存（默认 1 年）；index.html 不缓存。
    assets-cache-seconds: ${WEB_ASSETS_CACHE_SECONDS:31536000}
  oidc:
    # 仅供 ApiProxyController 选取 registrationId；OIDC 客户端本身由
    # spring.security.oauth2.client.* 配置（见上）。
    registration-id: nitrowater
  session:
    # 每次发布换一个值（git sha / 时间戳）：旧会话在下一次请求时被判失效，/api/** 返回 401
    # session_expired，浏览器据此重新登录。见 SessionEpochFilter / JsonAuthenticationEntryPoint。
    epoch: ${APP_SESSION_EPOCH:dev}
  # 登出后 AS 回跳的绝对地址；必须是 account 端 BFF_POST_LOGOUT_REDIRECT_URIS 中的一项。
  # 若从请求 Host 推导，127.0.0.1 / 换端口 / 内网 IP 都会匹配失败（AS 返回 400 空白页，且不销毁 SSO 会话）。
  post-logout-redirect-uri: ${POST_LOGOUT_REDIRECT_URI:http://localhost:5173}
  plugin-docs:
    upstream: ${PLUGIN_DOCS_UPSTREAM:http://localhost:8085}

logging:
  level:
    root: INFO
    org.springframework.security: INFO

